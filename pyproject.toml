[project]
name = "git-slop-maintainer"
version = "0.9.0"
description = "Internal compatibility and plugin tooling for the Rust git-slop CLI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "Corey Coto" },
]
keywords = ["git", "cli", "repository", "static-analysis", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0.2",
    "tiktoken>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/coreycoto/git-slop"
Repository = "https://github.com/coreycoto/git-slop"
Issues = "https://github.com/coreycoto/git-slop/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]
maintainer = [
    "agent-plugins @ git+https://github.com/coreycoto/agent-plugins.git@1cb87285df878822bcbb561bc684a57a24362a37",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/git_slop"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/man",
    "/scripts",
    "/plugins",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/pyproject.toml",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"
