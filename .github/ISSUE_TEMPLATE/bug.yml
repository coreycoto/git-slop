name: Bug
description: Broken shipped behavior, regression, or docs-versus-behavior mismatch.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for incorrect shipped behavior or regressions.

        Run `git-slop version`, `git-slop build-info --format json`, and `git slop doctor --bundle`. Attach only redacted output.

  - type: input
    id: version
    attributes:
      label: Git Slop version
      description: Exact output from `git-slop version`.
      placeholder: git-slop 0.x.y
    validations:
      required: true
  - type: textarea
    id: build-info
    attributes:
      label: Redacted build info
      description: Preserve version, revision, target, and build-source fields.
      render: json
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS 15 arm64
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Homebrew
        - Cargo Binstall
        - Cargo install
        - Scoop
        - GitHub Release archive
        - Source build
        - GitHub Action
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / why now
      description: What is broken, and why does it need attention now?
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Regression or known-good baseline
      description: What previous behavior, version, or contract should this be compared against?
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or triggering conditions
      description: Provide the smallest reproducible path, inputs, or artifact reference.
    validations:
      required: true
  - type: textarea
    id: command-error
    attributes:
      label: Exact command, exit code, and structured error
      description: Include the command, exit code, and JSON code/pointer.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor-bundle
    attributes:
      label: Redacted doctor bundle
      description: Attach the redacted `.slop/diagnostic-bundle.json`.
      render: json
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What user, maintainer, or contract impact does this cause?
    validations:
      required: true
