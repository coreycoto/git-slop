      recovery_revision:
        description: Recovery only - full 40-character source revision embedded in the published crate.
        required: false
        type: string
      recovery_crate_sha256:
        description: Recovery only - full 64-character crates.io package SHA-256.
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

