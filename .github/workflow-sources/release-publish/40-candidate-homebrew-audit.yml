  candidate-homebrew-audit:
    name: Audit candidate Formula with Homebrew
    needs: candidate-distribution
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Download candidate Formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-homebrew-formula
          path: ${{ runner.temp }}/candidate-homebrew

      - name: Audit candidate Formula with Homebrew
        shell: bash
        env:
          FORMULA_PATH: ${{ runner.temp }}/candidate-homebrew/git-slop.rb
        run: |
          set -euo pipefail
          tap=coreycoto/git-slop-release-candidate
          brew tap-new --no-git "$tap"
          tap_root="$(brew --repository "$tap")"
          cp "$FORMULA_PATH" "$tap_root/Formula/git-slop.rb"
          brew audit --strict --formula "$tap/git-slop"
          brew style --formula "$tap/git-slop"
