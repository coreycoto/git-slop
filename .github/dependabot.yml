version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns: ["*"]
        # Keep MSRV- or output-sensitive upgrades independently reviewable.
        exclude-patterns:
          - "tiktoken-rs"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
    # release-publish.yml is generated. Update this Action in the owning stage
    # fragment and regenerate the workflow so its source and tests stay aligned.
    ignore:
      - dependency-name: "Homebrew/actions/setup-homebrew"
