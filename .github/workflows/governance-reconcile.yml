name: Governance Reconcile

on:
  schedule:
    - cron: "20 11 * * 1"
  workflow_dispatch:

jobs:
  reconcile:
    name: Governance reconcile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      repository-projects: write
    env:
      GH_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN != '' && secrets.GH_PROJECTS_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate Codex surface
        run: cargo xtask validate-codex

      - name: Detect Codex credentials
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex reconciliation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        env:
          AGENT_PLUGINS_READ_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: scripts/with-agent-plugins.sh --prepare

      - name: Verify pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: scripts/with-agent-plugins.sh --verify

      - name: Prepare pinned Codex runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          mkdir -p .artifacts/codex .artifacts/github-governance "$RUNNER_TEMP/codex-runtime/.codex"
          cp .codex/config.toml "$RUNNER_TEMP/codex-runtime/.codex/config.toml"
          cp .codex/*.config.toml "$RUNNER_TEMP/codex-runtime/.codex/"
          scripts/with-agent-plugins.sh marketplace install \
            --manifest .agents/plugins/marketplace-source.json \
            --home "$RUNNER_TEMP/codex-runtime"

      - name: Run Codex governance reconcile
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/governance-reconcile.md
          output-file: .artifacts/codex/governance-reconcile.json
          codex-home: ${{ runner.temp }}/codex-runtime/.codex
          codex-args: >-
            ["--profile","ci_mutation","--model","gpt-5.4-mini","--output-schema",".github/codex/schemas/governance-reconcile.json"]
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Publish structured summary
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        run: |
          if [ -f .artifacts/codex/governance-reconcile.json ]; then
            {
              echo '```json'
              jq . .artifacts/codex/governance-reconcile.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload governance artifacts
        if: ${{ always() && steps.codex_preflight.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: governance-reconcile-artifacts
          path: |
            .artifacts/codex/governance-reconcile.json
            .artifacts/github-governance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
