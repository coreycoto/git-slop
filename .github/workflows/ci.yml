name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-validation:
    name: Public validation
    uses: ./.github/workflows/ci-public.yml
    permissions:
      contents: read

  maintainer-validation:
    name: Maintainer validation
    uses: ./.github/workflows/ci-maintainer.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
    permissions:
      contents: read

  full-validation:
    name: Full required validation
    if: always()
    needs:
      - public-validation
      - maintainer-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Start lane timer
        id: lane-timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Require every validation lane
        env:
          PUBLIC_VALIDATION: ${{ needs.public-validation.result }}
          MAINTAINER_VALIDATION: ${{ needs.maintainer-validation.result }}
        run: |
          for result in "$PUBLIC_VALIDATION" "$MAINTAINER_VALIDATION"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one required validation lane did not succeed."
              exit 1
            fi
          done
          echo "All required validation lanes succeeded."

      - name: Report lane timing
        if: always()
        shell: bash
        env:
          LANE_STARTED: ${{ steps.lane-timer.outputs.started }}
          LANE_RESULT: ${{ job.status }}
        run: echo "### Full validation — $(($(date +%s) - LANE_STARTED))s — $LANE_RESULT" >> "$GITHUB_STEP_SUMMARY"
