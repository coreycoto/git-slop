name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.12

  plugin-runtime-smoke:
    name: Plugin runtime smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Configure optional agent-plugins dependency access
        id: agent-plugins
        env:
          AGENT_PLUGINS_GIT_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_PLUGINS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_PLUGINS_GIT_TOKEN}@github.com/coreycoto/agent-plugins.git".insteadOf "https://github.com/coreycoto/agent-plugins.git"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-plugins.git >/dev/null 2>&1; then
            echo "agent-plugins is publicly readable; no extra git auth configured."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Optional agent-plugins runtime smoke skipped because coreycoto/agent-plugins is not readable in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Sync project
        if: steps.agent-plugins.outputs.available == 'true'
        run: uv sync --group dev --group maintainer

      - name: Run consumer plugin smoke
        if: steps.agent-plugins.outputs.available == 'true'
        run: uv run python scripts/smoke_plugin_consumer.py

      - name: Validate Codex surface
        if: steps.agent-plugins.outputs.available == 'true'
        run: uv run python scripts/validate_codex_surface.py

  smoke:
    name: CLI smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync project
        run: uv sync --group dev

      - name: Compile sources
        run: uv run python -m compileall src tests scripts

      - name: Lint
        run: uv run ruff check

      - name: Smoke version command
        run: uv run git-slop version

      - name: Validate Codex surface
        run: uv run python scripts/validate_codex_surface.py

      - name: Run smoke tests
        run: uv run pytest
