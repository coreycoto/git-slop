name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.12

  rust-quality:
    name: Rust quality and packaging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Validate Cargo package
        run: cargo package --locked

      - name: Validate crates.io publication
        run: cargo publish --dry-run --locked

      - name: Test distribution helpers
        run: |
          python3 -m unittest discover -s tests -p "test_distribution.py"
          python3 -m unittest discover -s tests -p "test_workflow_contracts.py"

      - name: Test GitHub Action
        run: node --test action/*.test.mjs

  maintainer-tooling:
    name: Python maintainer tooling
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync maintainer dependencies
        run: uv sync --locked --group dev

      - name: Compile maintainer sources
        run: uv run python -m compileall src/git_slop scripts tests

      - name: Lint maintainer sources
        run: uv run ruff check

      - name: Test maintainer contracts
        run: uv run pytest

  platform-smoke:
    name: Native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke release binary
        if: runner.os != 'Windows'
        run: ./target/release/git-slop version

      - name: Smoke release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\release\git-slop.exe version

  plugin-runtime-smoke:
    name: Plugin runtime smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Configure optional agent-plugins dependency access
        id: agent-plugins
        env:
          AGENT_PLUGINS_GIT_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_PLUGINS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_PLUGINS_GIT_TOKEN}@github.com/coreycoto/agent-plugins.git".insteadOf "https://github.com/coreycoto/agent-plugins.git"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-plugins.git >/dev/null 2>&1; then
            echo "agent-plugins is publicly readable; no extra git auth configured."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Optional agent-plugins runtime smoke skipped because coreycoto/agent-plugins is not readable in this run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync plugin test dependencies
        if: steps.agent-plugins.outputs.available == 'true'
        run: uv sync --locked --group dev --group maintainer

      - name: Test agent plugin contracts
        if: steps.agent-plugins.outputs.available == 'true'
        run: uv run pytest tests/test_agent_tools_integration.py tests/unit/agent_tools

      - name: Run consumer plugin smoke
        if: steps.agent-plugins.outputs.available == 'true'
        run: uv run python scripts/smoke_plugin_consumer.py

      - name: Validate Codex surface
        if: steps.agent-plugins.outputs.available == 'true'
        run: uv run python scripts/validate_codex_surface.py
