name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows
        uses: rhysd/actionlint@v1.7.12

  rust-quality:
    name: Rust quality and packaging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Validate Cargo package
        run: cargo package --locked

      - name: Validate crates.io publication
        run: cargo publish --dry-run --locked

      - name: Test distribution helpers
        run: |
          python3 -m unittest discover -s tests -p "test_distribution.py"
          python3 -m unittest discover -s tests -p "test_workflow_contracts.py"

      - name: Test GitHub Action
        run: node --test action/*.test.mjs

  maintainer-tooling:
    name: Python maintainer tooling
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync maintainer dependencies
        run: uv sync --locked --group dev

      - name: Compile maintainer sources
        run: uv run python -m compileall src/git_slop scripts tests

      - name: Lint maintainer sources
        run: uv run ruff check

      - name: Test maintainer contracts
        run: uv run pytest

  platform-smoke:
    name: Native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke release binary
        if: runner.os != 'Windows'
        run: ./target/release/git-slop version

      - name: Smoke release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\release\git-slop.exe version
