name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: CLI smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync project
        run: uv sync --group dev

      - name: Compile sources
        run: uv run python -m compileall src tests

      - name: Lint
        run: uv run ruff check

      - name: Smoke version command
        run: uv run git-slop version

      - name: Verify generated skill metadata
        run: uv run agent-tools skills sync-openai-metadata --repo-root . --check

      - name: Run smoke tests
        run: uv run pytest
