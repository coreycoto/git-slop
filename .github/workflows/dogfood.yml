name: Dogfood

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dogfood:
    name: Run Git Slop On Git Slop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Configure agent-tools dependency access
        env:
          AGENT_TOOLS_GIT_TOKEN: ${{ secrets.AGENT_TOOLS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_TOOLS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_TOOLS_GIT_TOKEN}@github.com/coreycoto/agent-tools.git".insteadOf "https://github.com/coreycoto/agent-tools.git"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-tools.git >/dev/null 2>&1; then
            echo "agent-tools is publicly readable; no extra git auth configured."
          else
            echo "coreycoto/agent-tools is private and cannot be fetched from CI without a token." >&2
            echo "Set AGENT_TOOLS_READ_TOKEN with read access to coreycoto/agent-tools, or make the repo public." >&2
            exit 1
          fi

      - name: Configure agent-plugins dependency access
        env:
          AGENT_PLUGINS_GIT_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_PLUGINS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_PLUGINS_GIT_TOKEN}@github.com/coreycoto/agent-plugins.git".insteadOf "https://github.com/coreycoto/agent-plugins.git"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-plugins.git >/dev/null 2>&1; then
            echo "agent-plugins is publicly readable; no extra git auth configured."
          else
            echo "coreycoto/agent-plugins is private and cannot be fetched from CI without a token." >&2
            echo "Set AGENT_PLUGINS_READ_TOKEN with read access to coreycoto/agent-plugins, or make the repo public." >&2
            exit 1
          fi

      - name: Sync project
        run: uv sync --group dev

      - name: Run detector
        run: uv run git-slop find

      - name: Publish summary
        if: always()
        run: |
          if [ -f .slop/latest/summary.md ]; then
            cat .slop/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Git Slop did not produce .slop/latest/summary.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dogfood artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-slop-dogfood
          path: .slop/latest
          if-no-files-found: warn

      - name: Warn-first threshold check
        if: always()
        run: |
          if [ -f .slop/latest/report.json ]; then
            uv run git-slop check || true
          else
            echo "Skipping threshold check because no report was generated."
          fi
