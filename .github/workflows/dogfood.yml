name: Dogfood

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dogfood:
    name: Run Git Slop On Git Slop
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync project
        run: uv sync --group dev

      - name: Run detector
        run: uv run git-slop find

      - name: Publish summary
        if: always()
        run: |
          if [ -f .slop/latest/summary.md ]; then
            cat .slop/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Git Slop did not produce .slop/latest/summary.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dogfood artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-slop-dogfood
          path: .slop/latest
          if-no-files-found: warn

      - name: Warn-first threshold check
        if: always()
        run: |
          if [ -f .slop/latest/report.json ]; then
            uv run git-slop check || true
          else
            echo "Skipping threshold check because no report was generated."
          fi
