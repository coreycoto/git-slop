name: Dogfood

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  dogfood:
    name: Run Git Slop On Git Slop
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build release binary
        run: cargo build -p git-slop --release --locked

      - name: Run detector
        shell: bash
        run: |
          set -euo pipefail
          detector_log="$RUNNER_TEMP/git-slop-find.log"
          if ! target/release/git-slop find >"$detector_log" 2>&1; then
            echo "Git Slop detector failed. Raw output is suppressed because repository paths are untrusted." >&2
            exit 1
          fi
          echo "Git Slop detector completed; publishing the escaped health report."

      - name: Publish summary
        if: always()
        run: |
          if [ -f .slop/latest/health.md ]; then
            cat .slop/latest/health.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Git Slop did not produce .slop/latest/health.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dogfood health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-slop-dogfood
          path: .slop/latest/health.md
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Warn-first threshold check
        if: always()
        run: |
          if [ -f .slop/latest/report.json ]; then
            target/release/git-slop check || true
          else
            echo "Skipping threshold check because no report was generated."
          fi
