name: Homebrew Release Handoff

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable git-slop version.
        required: true
        type: string
      revision:
        description: Exact 40-character source revision for the published version.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-handoff-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  handoff:
    name: Verify release and dispatch Homebrew tap update
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      formula-url: ${{ steps.verify.outputs.formula-url }}
      formula-sha256: ${{ steps.verify.outputs.formula-sha256 }}
      manifest-url: ${{ steps.verify.outputs.manifest-url }}
      manifest-sha256: ${{ steps.verify.outputs.manifest-sha256 }}
      crate-url: ${{ steps.verify.outputs.crate-url }}
      crate-sha256: ${{ steps.verify.outputs.crate-sha256 }}
    steps:
      - name: Checkout trusted current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate trusted main after environment approval
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          live_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$live_main"
          test "$live_main" = "$(git rev-parse refs/remotes/origin/main)"
          test -z "$(git status --short)"

      - name: Verify published release, provenance, and every digest
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          tag="v${VERSION}"
          gh api "repos/${REPOSITORY}/releases/tags/${tag}" > release.json
          jq -e --arg tag "$tag" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            release.json >/dev/null
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          test "$(git rev-parse "refs/tags/${tag}^{commit}")" = "$REVISION"
          git merge-base --is-ancestor "$REVISION" refs/remotes/origin/main

          rm -rf release-assets
          mkdir release-assets
          gh release download "$tag" --repo "$REPOSITORY" --dir release-assets
          find release-assets -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > actual-assets.txt
          printf '%s\n' \
            SHA256SUMS \
            git-slop.rb \
            "git-slop-${tag}-aarch64-apple-darwin.tar.gz" \
            "git-slop-${tag}-aarch64-pc-windows-msvc.zip" \
            "git-slop-${tag}-aarch64-unknown-linux-gnu.tar.gz" \
            "git-slop-${tag}-x86_64-pc-windows-msvc.zip" \
            "git-slop-${tag}-x86_64-unknown-linux-gnu.tar.gz" \
            release-manifest.json | LC_ALL=C sort > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt

          test "$(wc -l < release-assets/SHA256SUMS | tr -d ' ')" = "7"
          awk '
            NF != 2 { exit 1 }
            length($1) != 64 || $1 !~ /^[0-9a-f]+$/ { exit 1 }
            substr($2, 1, 1) == "*" { $2 = substr($2, 2) }
            $2 ~ /(^\/|\\|\.\.)/ { exit 1 }
            seen[$2]++ { exit 1 }
            END { if (NR != 7) exit 1 }
          ' release-assets/SHA256SUMS
          awk '{ name = $2; sub(/^\*/, "", name); print name }' release-assets/SHA256SUMS | LC_ALL=C sort > checksum-assets.txt
          grep -v '^SHA256SUMS$' expected-assets.txt > expected-checksum-assets.txt
          diff -u expected-checksum-assets.txt checksum-assets.txt
          (cd release-assets && sha256sum --check SHA256SUMS)

          jq -e \
            --arg version "$VERSION" \
            --arg tag "$tag" \
            --arg revision "$REVISION" \
            '.schema_version == 3 and .project == "git-slop" and .repository == "coreycoto/git-slop" and .version == $version and .tag == $tag and .revision == $revision and .crate_source.registry == "crates.io" and .crate_source.package == "git-slop" and .crate_source.version == $version and .crate_source.url == ("https://static.crates.io/crates/git-slop/git-slop-" + $version + ".crate") and .crate_source.revision == $revision and .crate_source.vcs_dirty == false and (.crate_source.sha256 | test("^[0-9a-f]{64}$")) and (.artifacts | length) == 5 and all(.artifacts[]; .path == .name and (.sha256 | test("^[0-9a-f]{64}$")) and .size_bytes > 0 and .url == ("https://github.com/coreycoto/git-slop/releases/download/" + $tag + "/" + .name)) and .checksums.algorithm == "sha256" and .checksums.name == "SHA256SUMS" and .checksums.url == ("https://github.com/coreycoto/git-slop/releases/download/" + $tag + "/SHA256SUMS")' \
            release-assets/release-manifest.json >/dev/null
          jq -r '.artifacts[] | [.target, .name, .os, .arch, .archive] | @tsv' \
            release-assets/release-manifest.json | LC_ALL=C sort > actual-targets.txt
          cat > expected-targets.txt <<EOF
          aarch64-apple-darwin	git-slop-${tag}-aarch64-apple-darwin.tar.gz	macos	aarch64	tar.gz
          aarch64-pc-windows-msvc	git-slop-${tag}-aarch64-pc-windows-msvc.zip	windows	aarch64	zip
          aarch64-unknown-linux-gnu	git-slop-${tag}-aarch64-unknown-linux-gnu.tar.gz	linux	aarch64	tar.gz
          x86_64-pc-windows-msvc	git-slop-${tag}-x86_64-pc-windows-msvc.zip	windows	x86_64	zip
          x86_64-unknown-linux-gnu	git-slop-${tag}-x86_64-unknown-linux-gnu.tar.gz	linux	x86_64	tar.gz
          EOF
          diff -u expected-targets.txt actual-targets.txt

          while IFS= read -r asset_name; do
            digest="$(sha256sum "release-assets/${asset_name}" | awk '{print $1}')"
            jq -e --arg name "$asset_name" --arg digest "sha256:${digest}" \
              '.assets[] | select(.name == $name) | .digest == $digest' \
              release.json >/dev/null
          done < actual-assets.txt

          formula_sha256="$(sha256sum release-assets/git-slop.rb | awk '{print $1}')"
          manifest_sha256="$(sha256sum release-assets/release-manifest.json | awk '{print $1}')"
          crate_url="$(jq -r '.crate_source.url' release-assets/release-manifest.json)"
          crate_sha256="$(jq -r '.crate_source.sha256' release-assets/release-manifest.json)"
          grep -Fx "  url \"${crate_url}\"" release-assets/git-slop.rb
          if grep -Eq '^  version "' release-assets/git-slop.rb; then
            echo "Homebrew derives the version from the crates.io URL; explicit version is forbidden." >&2
            exit 1
          fi
          grep -Fx "  sha256 \"${crate_sha256}\"" release-assets/git-slop.rb
          grep -Fx "    assert_match \"\\\"source_revision\\\": \\\"${REVISION}\\\"\", build_info" release-assets/git-slop.rb
          grep -Fx '    assert_match "\"source_dirty\": false", build_info' release-assets/git-slop.rb
          curl --fail --location --retry 5 "$crate_url" --output registry.crate
          test "$(sha256sum registry.crate | awk '{print $1}')" = "$crate_sha256"
          formula_url="https://github.com/${REPOSITORY}/releases/download/${tag}/git-slop.rb"
          manifest_url="https://github.com/${REPOSITORY}/releases/download/${tag}/release-manifest.json"
          {
            echo "formula-url=$formula_url"
            echo "formula-sha256=$formula_sha256"
            echo "manifest-url=$manifest_url"
            echo "manifest-sha256=$manifest_sha256"
            echo "crate-url=$crate_url"
            echo "crate-sha256=$crate_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch verified inputs to Homebrew tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          FORMULA_URL: ${{ steps.verify.outputs.formula-url }}
          FORMULA_SHA256: ${{ steps.verify.outputs.formula-sha256 }}
          MANIFEST_URL: ${{ steps.verify.outputs.manifest-url }}
          MANIFEST_SHA256: ${{ steps.verify.outputs.manifest-sha256 }}
          CRATE_URL: ${{ steps.verify.outputs.crate-url }}
          CRATE_SHA256: ${{ steps.verify.outputs.crate-sha256 }}
        run: |
          set -euo pipefail
          gh workflow run update-git-slop.yml \
            --repo coreycoto/homebrew-tap \
            --ref main \
            --field version="$VERSION" \
            --field revision="$REVISION" \
            --field formula_url="$FORMULA_URL" \
            --field formula_sha256="$FORMULA_SHA256" \
            --field manifest_url="$MANIFEST_URL" \
            --field manifest_sha256="$MANIFEST_SHA256" \
            --field crate_url="$CRATE_URL" \
            --field crate_sha256="$CRATE_SHA256"

      - name: Summarize handoff
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          FORMULA_SHA256: ${{ steps.verify.outputs.formula-sha256 }}
          MANIFEST_SHA256: ${{ steps.verify.outputs.manifest-sha256 }}
          CRATE_SHA256: ${{ steps.verify.outputs.crate-sha256 }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Homebrew tap update requested

          - version: \`${VERSION}\`
          - source revision: \`${REVISION}\`
          - crate SHA-256: \`${CRATE_SHA256}\`
          - release manifest SHA-256: \`${MANIFEST_SHA256}\`
          - Formula SHA-256: \`${FORMULA_SHA256}\`
          EOF
