name: Execution State Sync

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to resync manually.
        required: false
        type: string
      issue_number:
        description: Optional issue number to resync manually when no PR number is supplied.
        required: false
        type: string
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - closed

jobs:
  sync:
    name: Sync execution state
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      repository-projects: write
    env:
      ROADMAP_GH_TOKEN_SOURCE: ${{ secrets.GH_PROJECTS_TOKEN != '' && 'GH_PROJECTS_TOKEN' || 'github.token' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Prepare pinned agent-plugins runtime
        env:
          AGENT_PLUGINS_READ_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: scripts/with-agent-plugins.sh --prepare

      - name: Verify pinned agent-plugins runtime
        run: scripts/with-agent-plugins.sh --verify

      - name: Prepare artifact root
        id: artifact-root
        shell: bash
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          root=".artifacts/execution-state/$stamp"
          mkdir -p "$root"
          echo "path=$root" >> "$GITHUB_OUTPUT"

      - name: Resolve backlog project identity
        id: project
        shell: bash
        run: |
          echo "title=$(jq -r '.backlog_project.title' config/github/project_config.json)" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r '.backlog_project.number' config/github/project_config.json)" >> "$GITHUB_OUTPUT"

      - name: Preflight backlog project access
        id: project-access
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN != '' && secrets.GH_PROJECTS_TOKEN || github.token }}
        run: |
          snapshot_path="${{ steps.artifact-root.outputs.path }}/project-access-preflight.json"
          stderr_path="${{ steps.artifact-root.outputs.path }}/project-access.stderr"
          set +e
          scripts/with-agent-plugins.sh github project-snapshot \
            --require-live \
            --json-path "$snapshot_path" \
            > /dev/null \
            2> "$stderr_path"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve sync target
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            kind="pull_request"
            value="${{ github.event.pull_request.number }}"
          elif [ -n "${{ inputs.pr_number }}" ]; then
            kind="pull_request"
            value="${{ inputs.pr_number }}"
          elif [ -n "${{ inputs.issue_number }}" ]; then
            kind="issue"
            value="${{ inputs.issue_number }}"
          else
            echo "workflow_dispatch requires pr_number or issue_number" >&2
            exit 1
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Sync issue and project state
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN != '' && secrets.GH_PROJECTS_TOKEN || github.token }}
        shell: bash
        run: |
          args=(
            --json-path "${{ steps.artifact-root.outputs.path }}/execution-state.json"
            --markdown-path "${{ steps.artifact-root.outputs.path }}/execution-state.md"
            sync
          )
          if [ "${{ steps.project-access.outputs.available }}" != "true" ]; then
            args+=(--skip-project-sync)
          fi
          if [ "${{ steps.target.outputs.kind }}" = "pull_request" ]; then
            args+=(--pr-number "${{ steps.target.outputs.value }}")
          else
            args+=(--issue-number "${{ steps.target.outputs.value }}")
          fi
          stderr_path="${{ steps.artifact-root.outputs.path }}/execution-state.stderr"
          set +e
          scripts/with-agent-plugins.sh github execution-state "${args[@]}" 2> "$stderr_path"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q "Could not resolve an issue number from the supplied arguments" "$stderr_path"; then
            cat > "${{ steps.artifact-root.outputs.path }}/execution-state.json" <<'EOF'
          {"schema_version":1,"status":"skipped","reason":"no_linked_issue"}
          EOF
            cat > "${{ steps.artifact-root.outputs.path }}/execution-state.md" <<'EOF'
          ## Execution State Sync

          Skipped because this pull request does not reference a linked issue. Link the PR to an issue to enable execution-state mutation.
          EOF
            exit 0
          fi
          cat "$stderr_path" >&2
          exit "$status"

      - name: Render execution summary header
        shell: bash
        run: |
          project_access_label="available"
          project_note=""
          if [ "${{ steps.project-access.outputs.available }}" != "true" ]; then
            project_access_label="unavailable via ${{ env.ROADMAP_GH_TOKEN_SOURCE }}"
            project_note="- note: ${{ env.ROADMAP_GH_TOKEN_SOURCE }} could not read the owner-level roadmap project, so issue/project sync ran without project field updates"
          fi
          cat <<EOF > "${{ steps.artifact-root.outputs.path }}/summary.md"
          # Execution State Sync

          - event: ${{ github.event_name }}
          - sync target: ${{ steps.target.outputs.kind }} #${{ steps.target.outputs.value }}
          - roadmap project: ${{ steps.project.outputs.title }}
          - roadmap project number: ${{ steps.project.outputs.number }}
          - roadmap project token source: ${{ env.ROADMAP_GH_TOKEN_SOURCE }}
          - roadmap project access via ${{ env.ROADMAP_GH_TOKEN_SOURCE }}: $project_access_label
          - mode: automatic sync
          $project_note

          EOF
          cat "${{ steps.artifact-root.outputs.path }}/execution-state.md" >> "${{ steps.artifact-root.outputs.path }}/summary.md"

      - name: Publish execution summary
        shell: bash
        run: cat "${{ steps.artifact-root.outputs.path }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload execution artifacts
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: execution-state
          path: ${{ steps.artifact-root.outputs.path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
