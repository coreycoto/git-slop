name: Backlog Governance

on:
  workflow_dispatch:

jobs:
  governance:
    name: Governance Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Configure agent-tools dependency access
        env:
          AGENT_TOOLS_GIT_TOKEN: ${{ secrets.AGENT_TOOLS_READ_TOKEN != '' && secrets.AGENT_TOOLS_READ_TOKEN || secrets.GH_PROJECTS_TOKEN }}
        run: |
          if [ -n "$AGENT_TOOLS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_TOOLS_GIT_TOKEN}@github.com/coreycoto/agent-tools.git".insteadOf "https://github.com/coreycoto/agent-tools.git"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-tools.git >/dev/null 2>&1; then
            echo "agent-tools is publicly readable; no extra git auth configured."
          else
            echo "coreycoto/agent-tools is private and cannot be fetched from CI without a token." >&2
            echo "Set AGENT_TOOLS_READ_TOKEN or GH_PROJECTS_TOKEN with read access to coreycoto/agent-tools, or make the repo public." >&2
            exit 1
          fi

      - name: Sync project
        run: uv sync --group dev

      - name: Verify generated skill metadata
        run: uv run agent-tools skills sync-openai-metadata --repo-root . --check

      - name: Build governance artifacts
        run: |
          uv run agent-tools github project-snapshot --json-out .artifacts/github-governance/project-snapshot.json
          uv run agent-tools github issue-graph --json-out .artifacts/github-governance/issue-graph.json
          uv run agent-tools github milestone-check --json-out .artifacts/github-governance/milestone-check.json
          uv run agent-tools github sync-label-palette --json-out .artifacts/github-governance/label-palette.json
          uv run agent-tools github render-governance-summary --output .artifacts/github-governance/summary.md

      - name: Upload governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-artifacts
          path: .artifacts/github-governance
