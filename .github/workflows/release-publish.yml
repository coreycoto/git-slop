# @generated from .github/workflow-sources/release-publish/*.yml by cargo xtask generate-release-workflow
name: Release Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicitly authorize publishing exact current main, or recover an already-published immutable crate.
        required: true
        default: publish
        type: choice
        options:
          - publish
          - recover
      version:
        description: Strict stable version to publish or recover.
        required: true
        default: "0.11.8"
        type: string
      recovery_revision:
        description: Recovery only - full 40-character source revision embedded in the published crate.
        required: false
        type: string
      recovery_crate_sha256:
        description: Recovery only - full 64-character crates.io package SHA-256.
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate exact release identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.identity.outputs.mode || steps.recovery-identity.outputs.mode }}
      version: ${{ steps.identity.outputs.version || steps.recovery-identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag || steps.recovery-identity.outputs.tag }}
      control-revision: ${{ steps.identity.outputs.control-revision || steps.recovery-identity.outputs.control-revision }}
      revision: ${{ steps.identity.outputs.revision || steps.recovery-identity.outputs.revision }}
      crate-sha256: ${{ steps.package.outputs.crate-sha256 || steps.recovery-package.outputs.crate-sha256 }}
    steps:
      - name: Checkout dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact current main and release identity
        id: identity
        if: inputs.mode == 'publish'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RECOVERY_REVISION: ${{ inputs.recovery_revision }}
          RECOVERY_CRATE_SHA256: ${{ inputs.recovery_crate_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -z "$RECOVERY_REVISION"
          test -z "$RECOVERY_CRATE_SHA256"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$(git rev-parse refs/remotes/origin/main)"
          test -z "$(git status --short)"
          remote_tag="$(git ls-remote --refs origin "refs/tags/v${VERSION}" | awk '{print $1}')"
          if test -n "$remote_tag"; then
            git fetch origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
            test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$revision"
          fi
          {
            echo "mode=publish"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "control-revision=$revision"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Require explicit immutable recovery identity
        id: recovery-identity
        if: inputs.mode == 'recover'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.recovery_revision }}
          EXPECTED_CRATE_SHA256: ${{ inputs.recovery_crate_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_CRATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          control_revision="$(git rev-parse HEAD)"
          test "$control_revision" = "$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "${REVISION}^{commit}"
          git merge-base --is-ancestor "$REVISION" refs/remotes/origin/main
          remote_tag="$(git ls-remote --refs origin "refs/tags/v${VERSION}" | awk '{print $1}')"
          if test -n "$remote_tag"; then
            git fetch origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
            test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$REVISION"
          fi
          {
            echo "mode=recover"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "control-revision=$control_revision"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Run full repository preflight
        if: inputs.mode == 'publish'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          cargo xtask release-prepare --version "$VERSION" --check-only
          cargo fmt -p git-slop -- --check
          cargo clippy -p git-slop --all-targets --all-features --locked -- -D warnings
          cargo test -p git-slop --all-targets --all-features --locked
          cargo fmt --manifest-path xtask/Cargo.toml --all -- --check
          cargo clippy --manifest-path xtask/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path xtask/Cargo.toml --all-targets --all-features --locked
          cargo xtask validate
          node --test action/*.test.mjs
          cargo publish -p git-slop --dry-run --locked

      - name: Validate current recovery tooling
        if: inputs.mode == 'recover'
        run: |
          cargo fmt -p git-slop -- --check
          cargo clippy -p git-slop --all-targets --all-features --locked -- -D warnings
          cargo test -p git-slop --all-targets --all-features --locked
          cargo fmt --manifest-path xtask/Cargo.toml --all -- --check
          cargo clippy --manifest-path xtask/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path xtask/Cargo.toml --all-targets --all-features --locked
          cargo xtask validate
          node --test action/*.test.mjs

      - name: Package and verify candidate crate
        id: package
        if: inputs.mode == 'publish'
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          set -euo pipefail
          cargo package -p git-slop --locked
          mkdir -p candidate
          crate="target/package/git-slop-${VERSION}.crate"
          digest="$(sha256sum "$crate" | awk '{print $1}')"
          cp "$crate" "candidate/git-slop-${VERSION}.crate"
          cargo xtask verify-crate \
            --crate-file "candidate/git-slop-${VERSION}.crate" \
            --version "$VERSION" \
            --revision "$REVISION" \
            --expected-sha256 "$digest" \
            --output candidate/crate-source.json
          echo "crate-sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Download and verify immutable recovery package
        id: recovery-package
        if: inputs.mode == 'recover'
        shell: bash
        env:
          VERSION: ${{ steps.recovery-identity.outputs.version }}
          REVISION: ${{ steps.recovery-identity.outputs.revision }}
          EXPECTED_CRATE_SHA256: ${{ inputs.recovery_crate_sha256 }}
        run: |
          set -euo pipefail
          status="$(curl --user-agent "git-slop-release-workflow/1 (https://github.com/coreycoto/git-slop)" -sS -o registry-version.json -w '%{http_code}' "https://crates.io/api/v1/crates/git-slop/${VERSION}")"
          test "$status" = 200
          jq -e --arg version "$VERSION" --arg checksum "$EXPECTED_CRATE_SHA256" \
            '.version.num == $version and .version.yanked == false and .version.checksum == $checksum' \
            registry-version.json >/dev/null
          crate_url="https://static.crates.io/crates/git-slop/git-slop-${VERSION}.crate"
          mkdir -p candidate
          curl --fail --location --retry 5 --retry-delay 5 "$crate_url" \
            --output "candidate/git-slop-${VERSION}.crate"
          digest="$(sha256sum "candidate/git-slop-${VERSION}.crate" | awk '{print $1}')"
          test "$digest" = "$EXPECTED_CRATE_SHA256"
          cargo xtask verify-crate \
            --crate-file "candidate/git-slop-${VERSION}.crate" \
            --version "$VERSION" \
            --revision "$REVISION" \
            --expected-sha256 "$EXPECTED_CRATE_SHA256" \
            --output candidate/crate-source.json
          echo "crate-sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable release identity
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          CONTROL_REVISION: ${{ steps.identity.outputs.control-revision || steps.recovery-identity.outputs.control-revision }}
          REVISION: ${{ steps.identity.outputs.revision || steps.recovery-identity.outputs.revision }}
          CRATE_SHA256: ${{ steps.package.outputs.crate-sha256 || steps.recovery-package.outputs.crate-sha256 }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CRATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          # Markdown backticks below are literal format text.
          # shellcheck disable=SC2016
          {
            printf '## Immutable release identity\n\n'
            printf '| Field | Value |\n| --- | --- |\n'
            printf '| Mode | `%s` |\n' "$MODE"
            printf '| Version | `%s` |\n' "$VERSION"
            printf '| Workflow control revision | `%s` |\n' "$CONTROL_REVISION"
            printf '| Source revision | `%s` |\n' "$REVISION"
            printf '| Crate SHA-256 | `%s` |\n' "$CRATE_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-package
          path: candidate
          if-no-files-found: error
          retention-days: 7
  candidate-targets:
    name: Candidate ${{ matrix.target }}
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
      TAG: ${{ needs.candidate.outputs.tag }}
      REVISION: ${{ needs.candidate.outputs.revision }}
      EXPECTED_CRATE_SHA256: ${{ needs.candidate.outputs.crate-sha256 }}
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/candidate-target
    steps:
      - name: Checkout exact candidate contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-package
          path: candidate

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Verify and unpack candidate bytes
        if: runner.os != 'Windows' && matrix.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          crate="candidate/git-slop-${VERSION}.crate"
          test "$(sha256sum "$crate" | awk '{print $1}')" = "$EXPECTED_CRATE_SHA256"
          candidate_source_dir="${RUNNER_TEMP}/candidate-source"
          mkdir -p "$candidate_source_dir"
          tar -xzf "$crate" -C "$candidate_source_dir"

      - name: Verify and unpack candidate bytes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $crate = "candidate\git-slop-$env:VERSION.crate"
          $digest = (Get-FileHash -Algorithm SHA256 $crate).Hash.ToLowerInvariant()
          if ($digest -ne $env:EXPECTED_CRATE_SHA256) { throw "candidate package checksum mismatch" }
          $candidateSourceDir = Join-Path $env:RUNNER_TEMP "candidate-source"
          New-Item -ItemType Directory -Force -Path $candidateSourceDir | Out-Null
          tar -xzf $crate -C $candidateSourceDir

      - name: Install musl linker and unpack candidate bytes
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          crate="candidate/git-slop-${VERSION}.crate"
          test "$(sha256sum "$crate" | awk '{print $1}')" = "$EXPECTED_CRATE_SHA256"
          candidate_source_dir="${RUNNER_TEMP}/candidate-source"
          mkdir -p "$candidate_source_dir"
          tar -xzf "$crate" -C "$candidate_source_dir"

      - name: Build and smoke candidate Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          candidate_source_dir="${RUNNER_TEMP}/candidate-source"
          package="${candidate_source_dir}/git-slop-${VERSION}"
          cargo build --manifest-path "$package/Cargo.toml" --release --locked --target "$TARGET"
          root="git-slop-${TAG}-${TARGET}"
          mkdir -p "stage/$root/man" "stage/$root/completions" "stage/$root/schemas" smoke candidate-dist
          cp "$CARGO_TARGET_DIR/$TARGET/release/git-slop" "stage/$root/git-slop"
          cp "$package/LICENSE" "$package/README.md" "stage/$root/"
          cargo run --quiet --manifest-path "$package/Cargo.toml" --locked -- man --output "stage/$root/man/git-slop.1"
          cp "$package"/schemas/*.json "stage/$root/schemas/"
          for shell in bash zsh fish powershell nushell; do
            cargo run --quiet --manifest-path "$package/Cargo.toml" --locked -- completions "$shell" > "stage/$root/completions/git-slop.$shell"
          done
          chmod +x "stage/$root/git-slop"
          if tar --help 2>&1 | grep -q -- '--owner'; then
            tar --owner=0 --group=0 --numeric-owner -C stage -czf "candidate-dist/${root}.tar.gz" "$root"
          else
            tar --uid 0 --gid 0 --uname root --gname root -C stage -czf "candidate-dist/${root}.tar.gz" "$root"
          fi
          tar -C smoke -xzf "candidate-dist/${root}.tar.gz"
          test "$("smoke/$root/git-slop" version)" = "git-slop $VERSION"
          "smoke/$root/git-slop" build-info --format json > build-info.json
          jq -e --arg version "$VERSION" --arg revision "$REVISION" \
            '.schema_version == 1 and .project == "git-slop" and .version == $version and .source_revision == $revision and .source_dirty == false' \
            build-info.json

      - name: Validate packaged public contracts independently
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          root="git-slop-${TAG}-${TARGET}"
          bash scripts/validate-packaged-contracts.sh \
            "smoke/$root/git-slop" "smoke/$root/schemas" "$GITHUB_WORKSPACE"

      - name: Build and smoke candidate Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidateSourceDir = Join-Path $env:RUNNER_TEMP "candidate-source"
          $package = Join-Path $candidateSourceDir "git-slop-$env:VERSION"
          cargo build --manifest-path "$package\Cargo.toml" --release --locked --target $env:TARGET
          $root = "git-slop-$env:TAG-$env:TARGET"
          $stage = "stage\$root"
          New-Item -ItemType Directory -Force -Path $stage, "$stage\man", "$stage\completions", "$stage\schemas", "smoke", "candidate-dist" | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\$env:TARGET\release\git-slop.exe" "$stage\git-slop.exe"
          Copy-Item "$package\LICENSE", "$package\README.md" $stage
          cargo run --quiet --manifest-path "$package\Cargo.toml" --locked -- man --output "$stage\man\git-slop.1"
          Copy-Item "$package\schemas\*.json" "$stage\schemas"
          foreach ($shell in @("bash", "zsh", "fish", "powershell", "nushell")) {
            cargo run --quiet --manifest-path "$package\Cargo.toml" --locked -- completions $shell | Out-File -Encoding utf8NoBOM "$stage\completions\git-slop.$shell"
          }
          Compress-Archive -Path $stage -DestinationPath "candidate-dist\$root.zip"
          Expand-Archive -Path "candidate-dist\$root.zip" -DestinationPath smoke
          if ((& "smoke\$root\git-slop.exe" version) -ne "git-slop $env:VERSION") { throw "version mismatch" }
          $info = (& "smoke\$root\git-slop.exe" build-info --format json | ConvertFrom-Json)
          if ($info.schema_version -ne 1 -or $info.project -ne "git-slop" -or $info.version -ne $env:VERSION -or $info.source_revision -ne $env:REVISION -or $info.source_dirty -ne $false) { throw "build identity mismatch" }

      - name: Upload candidate target archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ matrix.target }}
          path: candidate-dist/*
          if-no-files-found: error
          retention-days: 7
  candidate-distribution:
    name: Validate candidate manifest and Formula
    needs: [candidate, candidate-targets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Download candidate provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-package
          path: candidate

      - name: Download candidate archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: candidate-*
          path: candidate-dist
          merge-multiple: true

      - name: Dry-run release manifest and crates-backed Formula
        shell: bash
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          TAG: ${{ needs.candidate.outputs.tag }}
          REVISION: ${{ needs.candidate.outputs.revision }}
          EXPECTED_CRATE_SHA256: ${{ needs.candidate.outputs.crate-sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "candidate/git-slop-${VERSION}.crate" | awk '{print $1}')" = "$EXPECTED_CRATE_SHA256"
          if ! git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            git \
              -c user.name="git-slop release validation" \
              -c user.email="git-slop-release-validation@users.noreply.github.com" \
              tag -a -m "Git Slop ${TAG}" "$TAG" "$REVISION"
          fi
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$REVISION"
          cargo xtask release-manifest \
            --dist-dir candidate-dist \
            --crate-source candidate/crate-source.json \
            --output candidate-dist/release-manifest.json \
            --checksum-output candidate-dist/SHA256SUMS \
            --tag "$TAG"
          cargo xtask homebrew-formula \
            --manifest candidate-dist/release-manifest.json \
            --formula candidate-dist/git-slop.rb
          cargo xtask sbom --output-dir candidate-dist
          mkdir -p official-schemas/cyclonedx official-schemas/spdx
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/CycloneDX/specification/1.5/schema/bom-1.5.schema.json \
            --output official-schemas/cyclonedx/bom-1.5.schema.json
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/CycloneDX/specification/1.5/schema/jsf-0.82.schema.json \
            --output official-schemas/cyclonedx/jsf-0.82.schema.json
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/CycloneDX/specification/1.5/schema/spdx.schema.json \
            --output official-schemas/cyclonedx/spdx.schema.json
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/spdx/spdx-spec/v2.3/schemas/spdx-schema.json \
            --output official-schemas/spdx/spdx-schema.json
          npx --yes ajv-cli@5.0.0 validate --strict=false \
            -s official-schemas/cyclonedx/bom-1.5.schema.json \
            -r official-schemas/cyclonedx/jsf-0.82.schema.json \
            -r official-schemas/cyclonedx/spdx.schema.json \
            -d candidate-dist/git-slop.cdx.json
          npx --yes ajv-cli@5.0.0 validate --strict=false \
            -s official-schemas/spdx/spdx-schema.json \
            -d candidate-dist/git-slop.spdx.json
          cargo xtask release-manifest \
            --dist-dir candidate-dist \
            --crate-source candidate/crate-source.json \
            --output candidate-dist/release-manifest.json \
            --checksum-output candidate-dist/SHA256SUMS \
            --tag "$TAG"
          (cd candidate-dist && sha256sum --check SHA256SUMS)
          test "$(wc -l < candidate-dist/SHA256SUMS | tr -d ' ')" = "11"

      - name: Upload candidate Formula for Homebrew audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-homebrew-formula
          path: candidate-dist/git-slop.rb
          if-no-files-found: error
          retention-days: 1
  candidate-homebrew-audit:
    name: Audit candidate Formula with Homebrew
    needs: candidate-distribution
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Download candidate Formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-homebrew-formula
          path: ${{ runner.temp }}/candidate-homebrew

      - name: Audit candidate Formula with Homebrew
        shell: bash
        env:
          FORMULA_PATH: ${{ runner.temp }}/candidate-homebrew/git-slop.rb
        run: |
          set -euo pipefail
          tap=coreycoto/git-slop-release-candidate
          brew tap-new --no-git "$tap"
          tap_root="$(brew --repository "$tap")"
          cp "$FORMULA_PATH" "$tap_root/Formula/git-slop.rb"
          brew audit --strict --formula "$tap/git-slop"
          brew style --formula "$tap/git-slop"
  publish-crate:
    name: Dispatch-authorized crates.io publication and exact tag
    needs: [candidate, candidate-distribution, candidate-homebrew-audit]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      mode: ${{ needs.candidate.outputs.mode }}
      control-revision: ${{ needs.candidate.outputs.control-revision }}
      version: ${{ steps.registry.outputs.version }}
      tag: ${{ steps.registry.outputs.tag }}
      revision: ${{ steps.registry.outputs.revision }}
      crate-url: ${{ steps.registry.outputs.crate-url }}
      crate-sha256: ${{ steps.registry.outputs.crate-sha256 }}
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Download trusted candidate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-package
          path: ${{ runner.temp }}/source-package

      - name: Revalidate dispatch-authorized release identity
        shell: bash
        env:
          MODE: ${{ needs.candidate.outputs.mode }}
          CONTROL_REVISION: ${{ needs.candidate.outputs.control-revision }}
          REVISION: ${{ needs.candidate.outputs.revision }}
          VERSION: ${{ needs.candidate.outputs.version }}
          EXPECTED_CRATE_SHA256: ${{ needs.candidate.outputs.crate-sha256 }}
          CANDIDATE_DIR: ${{ runner.temp }}/source-package
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          [[ "$CONTROL_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$CONTROL_REVISION" = "$GITHUB_SHA"
          test "$CONTROL_REVISION" = "$(git rev-parse refs/remotes/origin/main)"
          test "$REVISION" = "$(git rev-parse HEAD)"
          case "$MODE" in
            publish)
              test "$REVISION" = "$CONTROL_REVISION"
              ;;
            recover)
              git merge-base --is-ancestor "$REVISION" refs/remotes/origin/main
              ;;
            *)
              echo "Unsupported release mode: $MODE" >&2
              exit 1
              ;;
          esac
          test -z "$(git status --short)"
          test "$(sha256sum "${CANDIDATE_DIR}/git-slop-${VERSION}.crate" | awk '{print $1}')" = "$EXPECTED_CRATE_SHA256"
          cargo xtask verify-crate --crate-file "${CANDIDATE_DIR}/git-slop-${VERSION}.crate" --version "$VERSION" --revision "$REVISION" --expected-sha256 "$EXPECTED_CRATE_SHA256" --output "${CANDIDATE_DIR}/reverified-crate-source.json"
          cmp "${CANDIDATE_DIR}/crate-source.json" "${CANDIDATE_DIR}/reverified-crate-source.json"
          if test "$MODE" = publish; then
            cargo package -p git-slop --locked --no-verify
            cmp "target/package/git-slop-${VERSION}.crate" "${CANDIDATE_DIR}/git-slop-${VERSION}.crate"
          else
            status="$(curl --user-agent "git-slop-release-workflow/1 (https://github.com/coreycoto/git-slop)" -sS -o registry-version.json -w '%{http_code}' "https://crates.io/api/v1/crates/git-slop/${VERSION}")"
            test "$status" = 200
            jq -e --arg version "$VERSION" --arg checksum "$EXPECTED_CRATE_SHA256" \
              '.version.num == $version and .version.yanked == false and .version.checksum == $checksum' \
              registry-version.json >/dev/null
            crate_url="https://static.crates.io/crates/git-slop/git-slop-${VERSION}.crate"
            curl --fail --location --retry 5 --retry-delay 5 "$crate_url" --output registry-recovery.crate
            test "$(sha256sum registry-recovery.crate | awk '{print $1}')" = "$EXPECTED_CRATE_SHA256"
            cmp registry-recovery.crate "${CANDIDATE_DIR}/git-slop-${VERSION}.crate"
          fi

      - name: Inspect immutable registry and tag state
        id: state
        shell: bash
        env:
          MODE: ${{ needs.candidate.outputs.mode }}
          VERSION: ${{ needs.candidate.outputs.version }}
          TAG: ${{ needs.candidate.outputs.tag }}
          REVISION: ${{ needs.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          status="$(curl --user-agent "git-slop-release-workflow/1 (https://github.com/coreycoto/git-slop)" -sS -o registry-version.json -w '%{http_code}' "https://crates.io/api/v1/crates/git-slop/${VERSION}")"
          case "$status" in
            200)
              jq -e '.version.yanked == false' registry-version.json >/dev/null
              crate_exists=true
              ;;
            404) crate_exists=false ;;
            *) cat registry-version.json >&2; exit 1 ;;
          esac
          if test "$MODE" = recover && test "$crate_exists" != true; then
            echo "Recovery requires an existing, non-yanked crates.io package." >&2
            exit 1
          fi
          remote_tag="$(git ls-remote --refs origin "refs/tags/${TAG}" | awk '{print $1}')"
          if test -n "$remote_tag"; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$REVISION"
            if test "$crate_exists" != true; then
              echo "Exact tag exists before crates.io publication; refusing to reverse the release order." >&2
              exit 1
            fi
          fi
          echo "crate-exists=$crate_exists" >> "$GITHUB_OUTPUT"
          echo "tag-exists=$([[ -n "$remote_tag" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Exchange GitHub OIDC identity for crates.io token
        id: crates-io-auth
        if: needs.candidate.outputs.mode == 'publish' && steps.state.outputs.crate-exists != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish exact crates.io package
        id: publish
        if: needs.candidate.outputs.mode == 'publish' && steps.state.outputs.crate-exists != 'true'
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish -p git-slop --locked --no-verify

      - name: Download and verify exact registry bytes
        id: registry
        shell: bash
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          TAG: ${{ needs.candidate.outputs.tag }}
          REVISION: ${{ needs.candidate.outputs.revision }}
          EXPECTED_CRATE_SHA256: ${{ needs.candidate.outputs.crate-sha256 }}
          CANDIDATE_DIR: ${{ runner.temp }}/source-package
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(curl --user-agent "git-slop-release-workflow/1 (https://github.com/coreycoto/git-slop)" -sS -o registry-version.json -w '%{http_code}' "https://crates.io/api/v1/crates/git-slop/${VERSION}")"
            test "$status" = 200 && break
            test "$attempt" != 30
            sleep 10
          done
          jq -e '.version.yanked == false' registry-version.json >/dev/null
          index_sha256="$(jq -r '.version.checksum' registry-version.json)"
          test "$index_sha256" = "$EXPECTED_CRATE_SHA256"
          crate_url="https://static.crates.io/crates/git-slop/git-slop-${VERSION}.crate"
          mkdir -p registry
          curl --fail --location --retry 5 --retry-delay 5 "$crate_url" --output "registry/git-slop-${VERSION}.crate"
          registry_sha256="$(sha256sum "registry/git-slop-${VERSION}.crate" | awk '{print $1}')"
          test "$registry_sha256" = "$index_sha256"
          test "$registry_sha256" = "$EXPECTED_CRATE_SHA256"
          cargo xtask verify-crate --crate-file "registry/git-slop-${VERSION}.crate" --version "$VERSION" --revision "$REVISION" --expected-sha256 "$registry_sha256" --output registry/crate-source.json
          cmp "${CANDIDATE_DIR}/crate-source.json" registry/crate-source.json
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "revision=$REVISION"
            echo "crate-url=$crate_url"
            echo "crate-sha256=$registry_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Create missing exact release tag
        if: steps.state.outputs.tag-exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.candidate.outputs.mode }}
          CONTROL_REVISION: ${{ needs.candidate.outputs.control-revision }}
          TAG: ${{ needs.candidate.outputs.tag }}
          REVISION: ${{ needs.candidate.outputs.revision }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$CONTROL_REVISION" = "$GITHUB_SHA"
          test "$CONTROL_REVISION" = "$(git rev-parse refs/remotes/origin/main)"
          if test "$MODE" = recover; then
            git merge-base --is-ancestor "$REVISION" refs/remotes/origin/main
          else
            test "$REVISION" = "$CONTROL_REVISION"
          fi
          test -z "$(git ls-remote --refs origin "refs/tags/${TAG}")"
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" | gpg --batch --import
          signing_key="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          test -n "$signing_key"
          signing_email="$(
            gpg --batch --with-colons --list-secret-keys "$signing_key" |
              awk -F: '$1 == "uid" && match($10, /<[^<>[:space:]]+@[^<>[:space:]]+>/) {
                print substr($10, RSTART + 1, RLENGTH - 2)
                exit
              }'
          )"
          test -n "$signing_email"
          git config user.signingkey "$signing_key"
          git config user.name "git-slop release automation"
          git config user.email "$signing_email"
          if git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$REVISION"
            git verify-tag "$TAG"
          else
            git tag -s -m "Git Slop ${TAG}" "$TAG" "$REVISION"
            git verify-tag "$TAG"
          fi
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
            push origin "refs/tags/${TAG}"
          unset authorization
          test "$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')" = "$REVISION"

      - name: Dispatch immutable release identity to Homebrew tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          VERSION: ${{ steps.registry.outputs.version }}
          REVISION: ${{ steps.registry.outputs.revision }}
          CRATE_URL: ${{ steps.registry.outputs.crate-url }}
          CRATE_SHA256: ${{ steps.registry.outputs.crate-sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CRATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$CRATE_URL" = "https://static.crates.io/crates/git-slop/git-slop-${VERSION}.crate"
          gh workflow run update-git-slop.yml \
            --repo coreycoto/homebrew-tap \
            --ref main \
            --field version="$VERSION" \
            --field revision="$REVISION" \
            --field crate_url="$CRATE_URL" \
            --field crate_sha256="$CRATE_SHA256"

      - name: Summarize dispatch-authorized publication
        shell: bash
        env:
          VERSION: ${{ steps.registry.outputs.version }}
          REVISION: ${{ steps.registry.outputs.revision }}
          CRATE_SHA256: ${{ steps.registry.outputs.crate-sha256 }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Dispatch-authorized publication

          - authorization: explicit Release Publish workflow dispatch by \`${GITHUB_ACTOR}\`; the branch-restricted \`release\` environment adds no reviewer gate
          - version: \`${VERSION}\`
          - source revision: \`${REVISION}\`
          - crate SHA-256: \`${CRATE_SHA256}\`
          - Homebrew: the tap receiver was dispatched with this immutable identity and will wait for the exact public GitHub Release before deriving and reverifying its Formula and manifest digests
          EOF

      - name: Upload verified registry package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-registry-crate
          path: registry
          if-no-files-found: error
          retention-days: 1
  build:
    name: Build registry crate for ${{ matrix.target }}
    needs: publish-crate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.publish-crate.outputs.version }}
      TAG: ${{ needs.publish-crate.outputs.tag }}
      REVISION: ${{ needs.publish-crate.outputs.revision }}
      EXPECTED_CRATE_SHA256: ${{ needs.publish-crate.outputs.crate-sha256 }}
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Download verified registry package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-registry-crate
          path: registry

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Verify registry bytes and unpack source
        shell: bash
        run: |
          set -euo pipefail
          crate="registry/git-slop-${VERSION}.crate"
          test "$(sha256sum "$crate" | awk '{print $1}')" = "$EXPECTED_CRATE_SHA256"
          mkdir registry-source
          tar -xzf "$crate" -C registry-source

      - name: Package and smoke Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package="registry-source/git-slop-${VERSION}"
          cargo build --manifest-path "$package/Cargo.toml" --release --locked --target "$TARGET"
          root="git-slop-${TAG}-${TARGET}"
          mkdir -p "stage/$root/man" "stage/$root/completions" "stage/$root/schemas" smoke dist
          cp "$CARGO_TARGET_DIR/$TARGET/release/git-slop" "stage/$root/git-slop"
          cp "$package/LICENSE" "$package/README.md" "stage/$root/"
          cargo run --quiet --manifest-path "$package/Cargo.toml" --locked -- man --output "stage/$root/man/git-slop.1"
          cp "$package"/schemas/*.json "stage/$root/schemas/"
          for shell in bash zsh fish powershell nushell; do
            cargo run --quiet --manifest-path "$package/Cargo.toml" --locked -- completions "$shell" > "stage/$root/completions/git-slop.$shell"
          done
          chmod +x "stage/$root/git-slop"
          if tar --help 2>&1 | grep -q -- '--owner'; then
            tar --owner=0 --group=0 --numeric-owner -C stage -czf "dist/${root}.tar.gz" "$root"
          else
            tar --uid 0 --gid 0 --uname root --gname root -C stage -czf "dist/${root}.tar.gz" "$root"
          fi
          tar -C smoke -xzf "dist/${root}.tar.gz"
          test "$("smoke/$root/git-slop" version)" = "git-slop $VERSION"
          "smoke/$root/git-slop" build-info --format json > build-info.json
          jq -e --arg version "$VERSION" --arg revision "$REVISION" '.version == $version and .source_revision == $revision and .source_dirty == false' build-info.json

      - name: Package and smoke Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = "registry-source\git-slop-$env:VERSION"
          cargo build --manifest-path "$package\Cargo.toml" --release --locked --target $env:TARGET
          $root = "git-slop-$env:TAG-$env:TARGET"
          $stage = "stage\$root"
          New-Item -ItemType Directory -Force -Path $stage, "$stage\man", "$stage\completions", "$stage\schemas", "smoke", "dist" | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\$env:TARGET\release\git-slop.exe" "$stage\git-slop.exe"
          Copy-Item "$package\LICENSE", "$package\README.md" $stage
          cargo run --quiet --manifest-path "$package\Cargo.toml" --locked -- man --output "$stage\man\git-slop.1"
          Copy-Item "$package\schemas\*.json" "$stage\schemas"
          foreach ($shell in @("bash", "zsh", "fish", "powershell", "nushell")) {
            cargo run --quiet --manifest-path "$package\Cargo.toml" --locked -- completions $shell | Out-File -Encoding utf8NoBOM "$stage\completions\git-slop.$shell"
          }
          Compress-Archive -Path $stage -DestinationPath "dist\$root.zip"
          Expand-Archive -Path "dist\$root.zip" -DestinationPath smoke
          if ((& "smoke\$root\git-slop.exe" version) -ne "git-slop $env:VERSION") { throw "version mismatch" }
          $info = (& "smoke\$root\git-slop.exe" build-info --format json | ConvertFrom-Json)
          if ($info.version -ne $env:VERSION -or $info.source_revision -ne $env:REVISION -or $info.source_dirty -ne $false) { throw "build identity mismatch" }

      - name: Upload final target archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1
  draft-release:
    name: Prepare verified Marketplace draft
    needs: [publish-crate, build]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    outputs:
      release-state: ${{ steps.release.outputs.state }}
      release-id: ${{ steps.release.outputs.release-id || steps.draft.outputs.release-id }}
      release-manifest-sha256: ${{ steps.release-install.outputs.release-manifest-sha256 }}
      asset-sha256-by-target: ${{ steps.release-identity.outputs.asset-sha256-by-target }}
    env:
      VERSION: ${{ needs.publish-crate.outputs.version }}
      TAG: ${{ needs.publish-crate.outputs.tag }}
      REVISION: ${{ needs.publish-crate.outputs.revision }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish-crate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout current recovery control tooling
        if: needs.publish-crate.outputs.mode == 'recover'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish-crate.outputs.control-revision }}
          path: release-control
          sparse-checkout: action
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Download final archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download registry provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-registry-crate
          path: registry

      - name: Generate release manifest, checksums, and Formula
        shell: bash
        run: |
          set -euo pipefail
          cp registry/crate-source.json dist/crate-source.json
          cargo xtask release-manifest --dist-dir dist --crate-source dist/crate-source.json --output dist/release-manifest.json --checksum-output dist/SHA256SUMS --tag "$TAG"
          cargo xtask homebrew-formula --manifest dist/release-manifest.json --formula dist/git-slop.rb
          cargo xtask sbom --output-dir dist
          cargo xtask release-manifest --dist-dir dist --crate-source dist/crate-source.json --output dist/release-manifest.json --checksum-output dist/SHA256SUMS --tag "$TAG"
          rm dist/crate-source.json
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = "11"

      - name: Generate complete release notes
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fqx "## ${VERSION} - Unreleased" CHANGELOG.md; then
            echo "CHANGELOG.md release heading for ${VERSION} is still Unreleased." >&2
            exit 1
          fi
          awk -v prefix="## ${VERSION} - " '
            index($0, prefix) == 1 { capture = 1 }
            capture && /^## / && index($0, prefix) != 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-changes.md
          grep -Fq "## ${VERSION} - " release-changes.md
          # shellcheck disable=SC2016
          {
            printf '# Git Slop %s\n\n' "$VERSION"
            printf '## Changes\n\n'
            sed '1d' release-changes.md
            printf '\n## Install\n\n'
            printf -- '- Cargo: `cargo install git-slop --version %s --locked`\n' "$VERSION"
            printf -- '- Homebrew: `brew install coreycoto/tap/git-slop`\n'
            printf -- '- Windows bucket: install from the downstream `coreycoto/scoop-bucket` manifest after relay verification.\n'
            printf -- '- GitHub archives: download the target archive and `SHA256SUMS` from this release.\n'
            printf '\n## Verify\n\n'
            printf -- '- Checksums: `sha256sum --check SHA256SUMS --ignore-missing`\n'
            printf -- '- Attestations: `gh attestation verify <asset> --repo %s --signer-repo %s`\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY"
            printf -- '- SBOMs: `git-slop.cdx.json` (CycloneDX 1.5) and `git-slop.spdx.json` (SPDX 2.3).\n'
            printf '\n## Downstream status\n\n'
            printf '| Surface | Draft-time status | Verification |\n'
            printf '| --- | --- | --- |\n'
            printf '| Release publication | Candidate verified; public release pending | [Release workflow](%s/%s/actions/runs/%s) |\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '%s\n' '| Homebrew Formula | Receiver waits for this exact public immutable release | [Receiver runs](https://github.com/coreycoto/homebrew-tap/actions/workflows/update-git-slop.yml) |'
            printf '%s\n' '| Homebrew bottles | Pending exact receiver PR and trusted-main bottle publication | [Bottle runs](https://github.com/coreycoto/homebrew-tap/actions?query=workflow%3A%22Release+git-slop+bottles%22) |'
            printf '%s\n' '| Scoop manifest | Receiver starts only after public-release verification | [Receiver runs](https://github.com/coreycoto/scoop-bucket/actions/workflows/update-git-slop.yml) |'
            printf '\nThe linked workflow views are the authoritative downstream status surfaces; each receiver independently reverifies this release identity before publishing.\n'
          } > release-notes.md

      - name: Inspect existing GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq --arg tag "$TAG" --arg revision "$REVISION" \
                '[.[][] | select(
                  .tag_name == $tag or
                  (
                    .draft == true and
                    .published_at == null and
                    .prerelease == false and
                    .name == $tag and
                    .target_commitish == $revision and
                    (.tag_name | startswith("untagged-"))
                  )
                )]' \
            > release-matches.json
          match_count="$(jq -r 'length' release-matches.json)"
          case "$match_count" in
            0)
              state=missing
              ;;
            1)
              jq '.[0]' release-matches.json > release.json
              release_id="$(jq -er '.id | select(type == "number" and . > 0)' release.json)"
              [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
              jq -e --arg tag "$TAG" --arg revision "$REVISION" --argjson release_id "$release_id" \
                '.id == $release_id and .prerelease == false and (
                  (.tag_name == $tag and ((.draft == true and .published_at == null) or (.draft == false and .immutable == true and (.published_at | type == "string")))) or
                  (.draft == true and .published_at == null and .name == $tag and .target_commitish == $revision and (.tag_name | startswith("untagged-")))
                )' \
                release.json >/dev/null
              state="$(jq -r 'if .draft then "draft" else "published" end' release.json)"
              echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Multiple GitHub Releases match exact or safely detached identity ${TAG}; refusing ambiguous release mutation." >&2
              jq -r '.[] | "id=\(.id) state=\(if .draft then "draft" else "published" end) assets=\(.assets | length) url=\(.html_url)"' release-matches.json >&2
              exit 1
              ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Attest final distribution files
        if: steps.release.outputs.state != 'published'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/release-manifest.json
            dist/git-slop.rb
            dist/git-slop.cdx.json
            dist/git-slop.spdx.json

      - name: Create or refresh verified draft release
        id: draft
        if: steps.release.outputs.state != 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="${{ steps.release.outputs.release-id }}"
          if test "${{ steps.release.outputs.state }}" = missing; then
            gh release create "$TAG" --draft --notes-file release-notes.md --title "$TAG" --target "$REVISION" --verify-tag
            for attempt in $(seq 1 10); do
              gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                | jq --arg tag "$TAG" --arg revision "$REVISION" \
                    '[.[][] | select(
                      .tag_name == $tag or
                      (
                        .draft == true and
                        .published_at == null and
                        .prerelease == false and
                        .name == $tag and
                        .target_commitish == $revision and
                        (.tag_name | startswith("untagged-"))
                      )
                    )]' \
                > release-matches.json
              match_count="$(jq -r 'length' release-matches.json)"
              if test "$match_count" = 1; then
                release_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' release-matches.json)"
                break
              fi
              if test "$match_count" -gt 1; then
                echo "Multiple GitHub Releases match exact or safely detached identity ${TAG}; refusing ambiguous release mutation." >&2
                jq -r '.[] | "id=\(.id) state=\(if .draft then "draft" else "published" end) assets=\(.assets | length) url=\(.html_url)"' release-matches.json >&2
                exit 1
              fi
              test "$attempt" != 10
              sleep 2
            done
          fi
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          endpoint="repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          release_json="$(gh api "$endpoint")"
          jq -e --arg tag "$TAG" --arg revision "$REVISION" --argjson release_id "$release_id" \
            '.id == $release_id and .draft == true and .prerelease == false and .published_at == null and (
              .tag_name == $tag or
              (.name == $tag and .target_commitish == $revision and (.tag_name | startswith("untagged-")))
            )' \
            <<< "$release_json" >/dev/null
          jq -n --arg tag "$TAG" --arg revision "$REVISION" --rawfile body release-notes.md \
            '{tag_name: $tag, target_commitish: $revision, name: $tag, body: $body, draft: true, prerelease: false}' \
            > release-update.json
          gh api --method PATCH "$endpoint" --input release-update.json >/dev/null
          while IFS= read -r asset_id; do
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done < <(jq -r '.assets[].id' <<< "$release_json")
          for asset in dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/release-manifest.json dist/git-slop.rb dist/git-slop.cdx.json dist/git-slop.spdx.json; do
            asset_name="$(basename "$asset")"
            curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 300 \
              --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}" \
              >/dev/null
          done
          # GitHub can detach a draft to a synthetic untagged-* identity while
          # assets are uploaded. Reassert the exact signed tag after the final
          # upload, then bind every later check to this numeric release ID.
          gh api --method PATCH "$endpoint" --input release-update.json > release.json
          jq -e --arg tag "$TAG" --arg revision "$REVISION" --argjson release_id "$release_id" \
            '.id == $release_id and .tag_name == $tag and .target_commitish == $revision and .name == $tag and .draft == true and .prerelease == false and .published_at == null' \
            release.json >/dev/null
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Verify published no-op or refreshed draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release-id || steps.draft.outputs.release-id }}
        run: |
          set -euo pipefail
          rm -rf release-verification
          mkdir release-verification
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          jq -e --arg tag "$TAG" --argjson release_id "$RELEASE_ID" \
            '.id == $release_id and .tag_name == $tag and .prerelease == false and ((.draft == true and .published_at == null) or (.draft == false and .immutable == true and (.published_at | type == "string")))' \
            release.json >/dev/null
          manifest_asset_id="$(jq -er '.assets[] | select(.name == "release-manifest.json") | .id' release.json)"
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_asset_id}" \
            > release-manifest.inventory.json
          jq -r '.assets[].name' release.json | LC_ALL=C sort > actual-assets.txt
          jq -r '.artifacts[].name, .supplemental_assets[].name' release-manifest.inventory.json > expected-assets.txt
          printf '%s\n' SHA256SUMS release-manifest.json >> expected-assets.txt
          LC_ALL=C sort -o expected-assets.txt expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "release-verification/${asset_name}"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' release.json)
          (cd release-verification && sha256sum --check SHA256SUMS)
          jq -e --arg version "$VERSION" --arg tag "$TAG" --arg revision "$REVISION" '.schema_version == 3 and .version == $version and .tag == $tag and .revision == $revision and .crate_source.revision == $revision and (.supplemental_assets | length) == 3 and all(.supplemental_assets[]; .required == true and .contract_version == 1)' release-verification/release-manifest.json
          while IFS= read -r asset_name; do
            digest="$(sha256sum "release-verification/${asset_name}" | awk '{print $1}')"
            jq -e --arg name "$asset_name" --arg digest "sha256:${digest}" \
              '.assets[] | select(.name == $name) | .digest == $digest' \
              release.json >/dev/null
          done < actual-assets.txt

      - name: Verify Action installer against release assets
        id: release-install
        shell: bash
        env:
          GIT_SLOP_ACTION_VERSION: ${{ needs.publish-crate.outputs.version }}
          GIT_SLOP_RELEASE_REPOSITORY: ${{ github.repository }}
          GIT_SLOP_GITHUB_TOKEN: ${{ github.token }}
          GIT_SLOP_ALLOW_DRAFT_RELEASE: "true"
          GIT_SLOP_RELEASE_ID: ${{ steps.release.outputs.release-id || steps.draft.outputs.release-id }}
          ACTION_INSTALLER: ${{ needs.publish-crate.outputs.mode == 'recover' && 'release-control/action/install.mjs' || 'action/install.mjs' }}
        run: |
          set -euo pipefail
          node "$ACTION_INSTALLER"

      - name: Assert exact Action installer outputs
        id: release-identity
        shell: bash
        env:
          ACTUAL_VERSION: ${{ steps.release-install.outputs.version }}
          ACTUAL_REVISION: ${{ steps.release-install.outputs.source-revision }}
          ACTUAL_TARGET: ${{ steps.release-install.outputs.target }}
          ACTUAL_CRATE_SHA256: ${{ steps.release-install.outputs.crate-sha256 }}
          ACTUAL_MANIFEST_SHA256: ${{ steps.release-install.outputs.release-manifest-sha256 }}
          EXPECTED_CRATE_SHA256: ${{ needs.publish-crate.outputs.crate-sha256 }}
        run: |
          set -euo pipefail
          expected_manifest_sha256="$(sha256sum release-verification/release-manifest.json | awk '{print $1}')"
          test "$ACTUAL_VERSION" = "$VERSION"
          test "$ACTUAL_REVISION" = "$REVISION"
          test "$ACTUAL_TARGET" = "x86_64-unknown-linux-gnu"
          test "$ACTUAL_CRATE_SHA256" = "$EXPECTED_CRATE_SHA256"
          test "$ACTUAL_MANIFEST_SHA256" = "$expected_manifest_sha256"
          asset_sha256_by_target="$(jq -c 'reduce .artifacts[] as $artifact ({}; .[$artifact.target] = $artifact.sha256)' release-verification/release-manifest.json)"
          jq -e 'length == 7 and all(.[]; test("^[0-9a-f]{64}$"))' <<< "$asset_sha256_by_target" >/dev/null
          echo "asset-sha256-by-target=$asset_sha256_by_target" >> "$GITHUB_OUTPUT"
  draft-action-smoke:
    name: Draft Action smoke on ${{ matrix.target }}
    needs: [publish-crate, draft-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      # GitHub limits draft release visibility to tokens with push-level access.
      contents: write
    env:
      VERSION: ${{ needs.publish-crate.outputs.version }}
      TAG: ${{ needs.publish-crate.outputs.tag }}
      REVISION: ${{ needs.publish-crate.outputs.revision }}
    steps:
      - name: Checkout exact release Action revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish-crate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact immutable Action tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVISION"
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$REVISION"
          test -z "$(git status --short)"

      - name: Run exact release composite Action
        id: git-slop
        uses: ./
        env:
          GIT_SLOP_ALLOW_DRAFT_RELEASE: "true"
          GIT_SLOP_RELEASE_ID: ${{ needs.draft-release.outputs.release-id }}
        with:
          version: ${{ needs.publish-crate.outputs.version }}
          release-repository: ${{ github.repository }}
          target: ${{ matrix.target }}
          github-token: ${{ github.token }}
          policy: advisory
          annotations: "false"
          upload-artifact: "false"

      - name: Assert installed Action identity
        shell: bash
        env:
          ACTUAL_VERSION: ${{ steps.git-slop.outputs.version }}
          ACTUAL_REVISION: ${{ steps.git-slop.outputs.source-revision }}
          ACTUAL_TARGET: ${{ steps.git-slop.outputs.target }}
          ACTUAL_CRATE_SHA256: ${{ steps.git-slop.outputs.crate-sha256 }}
          ACTUAL_MANIFEST_SHA256: ${{ steps.git-slop.outputs.release-manifest-sha256 }}
          ACTUAL_ASSET_SHA256: ${{ steps.git-slop.outputs.asset-sha256 }}
          ANALYSIS_EXIT_CODE: ${{ steps.git-slop.outputs.analysis-exit-code }}
          POLICY_EXIT_CODE: ${{ steps.git-slop.outputs.policy-exit-code }}
          STATUS: ${{ steps.git-slop.outputs.status }}
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_CRATE_SHA256: ${{ needs.publish-crate.outputs.crate-sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.draft-release.outputs.release-manifest-sha256 }}
          EXPECTED_ASSET_SHA256: ${{ fromJSON(needs.draft-release.outputs.asset-sha256-by-target)[matrix.target] }}
        run: |
          set -euo pipefail
          test "$ACTUAL_VERSION" = "$VERSION"
          test "$ACTUAL_REVISION" = "$REVISION"
          test "$ACTUAL_TARGET" = "$EXPECTED_TARGET"
          test "$ACTUAL_CRATE_SHA256" = "$EXPECTED_CRATE_SHA256"
          test "$ACTUAL_MANIFEST_SHA256" = "$EXPECTED_MANIFEST_SHA256"
          test "$ACTUAL_ASSET_SHA256" = "$EXPECTED_ASSET_SHA256"
          test "$ANALYSIS_EXIT_CODE" = 0
          test "$POLICY_EXIT_CODE" = 0
          test "$STATUS" = advisory
  marketplace-ready:
    name: Marketplace release ready
    needs: [publish-crate, draft-release, draft-action-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.publish-crate.outputs.tag }}
      RELEASE_STATE: ${{ needs.draft-release.outputs.release-state }}
    steps:
      - name: Publish Marketplace handoff summary
        shell: bash
        run: |
          {
            printf '## Verified Git Slop %s release assets are Marketplace-ready\n\n' "$TAG"
            printf '%s\n\n' 'The crate, exact source tag, seven archives, checksums, release manifest, crates-backed Formula, and immutable tagged composite Action verify on all seven supported runner targets.'
            if test "$RELEASE_STATE" != "published"; then
              printf '%s\n\n' 'The workflow intentionally did **not** publish the GitHub Release.'
              printf '%s\n' 'Open the draft release, select **Publish this Action to the GitHub Marketplace**, choose **Code quality** and **Continuous integration**, and publish with 2FA. This is the only manual approval for the release. The already-dispatched Homebrew receiver will then verify the exact public release before preparing the tap update.'
            else
              printf '%s\n' 'The existing published release was reverified without mutation, and the dispatch-authorized publication job redispatched its immutable identity to the Homebrew receiver.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
