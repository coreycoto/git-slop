name: Release Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish tagged release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Configure git author
        run: |
          git config user.name "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"

      - name: Configure agent-plugins dependency access
        env:
          AGENT_PLUGINS_GIT_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_PLUGINS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_PLUGINS_GIT_TOKEN}@github.com/coreycoto/agent-plugins.git".insteadOf "https://github.com/coreycoto/agent-plugins.git"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-plugins.git >/dev/null 2>&1; then
            echo "agent-plugins is publicly readable; no extra git auth configured."
          else
            echo "coreycoto/agent-plugins is private and cannot be fetched from CI without a token." >&2
            echo "Set AGENT_PLUGINS_READ_TOKEN with read access to coreycoto/agent-plugins, or make the repo public." >&2
            exit 1
          fi
      - name: Sync project
        run: uv sync --group dev

      - name: Bootstrap agent-plugins marketplace source
        run: uv run python scripts/bootstrap_agent_plugins_marketplace.py install

      - name: Validate Codex surface
        run: uv run python scripts/validate_codex_surface.py

      - name: Build release artifacts
        run: uv build

      - name: Build release manifest
        run: uv run python scripts/build_release_manifest.py --dist-dir dist --output .artifacts/releases/release-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="v$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          fi
          notes_path=".artifacts/releases/${release_tag}-notes.md"
          checked_in_notes="docs/releases/${release_tag}.md"
          if [[ -f "$checked_in_notes" ]]; then
            cp "$checked_in_notes" "$notes_path"
          else
            {
              echo "# git-slop ${release_tag}"
              echo
              echo "## Artifacts"
              echo
              echo "- \`dist/git_slop-${release_tag#v}-py3-none-any.whl\`"
              echo "- \`dist/git_slop-${release_tag#v}.tar.gz\`"
              echo "- \`.artifacts/releases/release-manifest.json\`"
            } > "$notes_path"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" --title "$release_tag" --notes-file "$notes_path"
          else
            gh release create "$release_tag" --title "$release_tag" --notes-file "$notes_path"
          fi
          gh release upload "$release_tag" \
            "dist/git_slop-${release_tag#v}-py3-none-any.whl" \
            "dist/git_slop-${release_tag#v}.tar.gz" \
            ".artifacts/releases/release-manifest.json" \
            --clobber

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-publish-artifacts
          path: |
            dist
            .artifacts
          if-no-files-found: warn
