name: Dependency Remediation
run-name: Dependency Remediation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "35 11 * * 2"
  workflow_dispatch:
    inputs:
      mode:
        description: Run a read-only canary or perform the trusted remediation flow
        required: true
        type: choice
        default: canary
        options: [canary, remediate]
      release_tag:
        description: Optional stable release tag that requested this canary
        required: false
        type: string

concurrency:
  group: dependency-remediation-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  canary:
    name: Read-only remediation canary
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'canary'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate dependency-remediation contracts without credentials or mutation
        run: cargo xtask validate

      - name: Summarize canary
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          printf '## Dependency-remediation canary passed\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- no write token, OpenAI credential, or private acquisition credential was loaded' >> "$GITHUB_STEP_SUMMARY"
          if test -n "$RELEASE_TAG"; then
            printf -- "- release closeout: \`%s\`\n" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          fi

  recover:
    name: Recover exact prior publication before new work
    if: (github.event_name != 'pull_request_target' || (github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)) && (github.event_name != 'workflow_dispatch' || inputs.mode == 'remediate')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      outcome: ${{ steps.recover.outputs.outcome }}
      artifact_name: ${{ steps.recover.outputs.artifact_name }}
      handoff_id: ${{ steps.upload_handoff.outputs.artifact-id }}
      handoff_digest: ${{ steps.upload_handoff.outputs.artifact-digest }}
      handoff_name: ${{ steps.recover.outputs.artifact_name }}-handoff-00
    steps:
      - name: Checkout trusted recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate trusted Codex surface
        run: cargo xtask validate-codex

      - name: Acquire attested gh-steward release
        run: scripts/with-gh-steward.sh --prepare

      - name: Verify pinned gh-steward receipt
        run: scripts/with-gh-steward.sh --verify

      - name: Recover exact prior publication package
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: Dependency Remediation
        shell: bash
        run: |
          set -euo pipefail
          "$GH_STEWARD_BIN" runs recover \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --repo-root "$GITHUB_WORKSPACE" \
            --workflow dependency-remediation.yml \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-name "$RUN_NAME" --recovery-key workflow-history-v2 \
            --package-root "$RUNNER_TEMP/dependency-remediation-package" \
            --runner-temp "$RUNNER_TEMP" \
            --policy .agents/gh-steward-recovery-policy.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Stop when exact prior publication evidence is unavailable
        if: steps.recover.outputs.outcome == 'recovery_needed'
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/dependency-remediation-package/recovery-needed.json" ]; then
            cat "$RUNNER_TEMP/dependency-remediation-package/recovery-needed.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - name: Upload immutable native recovery handoff
        id: upload_handoff
        if: steps.recover.outputs.outcome != 'recovery_needed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.recover.outputs.artifact_name }}-handoff-00
          path: ${{ runner.temp }}/dependency-remediation-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  capture:
    name: Verify exact dependency source without credentials
    needs: recover
    if: needs.recover.outputs.outcome == 'fresh'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload_capture.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_capture.outputs.artifact-digest }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Validate exact source event
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dependency-remediation-capture"
          mkdir -p "$root/events"
          cp -- "$GITHUB_EVENT_PATH" "$root/events/trigger-event.json"
          event_sha="$(sha256sum "$root/events/trigger-event.json" | awk '{print $1}')"
          if [ "$EVENT_NAME" = pull_request_target ]; then
            [[ "$(jq -er '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")" == "$GITHUB_REPOSITORY" ]] || { echo 'fork dependency updates are not eligible for trusted publication' >&2; exit 1; }
            source_repository="$(jq -er '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")"
            source_ref="$(jq -er '.pull_request.head.ref' "$GITHUB_EVENT_PATH")"
            source_sha="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
            base_ref="$(jq -er '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
            base_sha="$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          [[ "$(jq -er '.pull_request.base.repo.full_name' "$GITHUB_EVENT_PATH")" == "$GITHUB_REPOSITORY" ]]
          else
            source_repository="$GITHUB_REPOSITORY"
            source_ref="$GITHUB_REF_NAME"
            source_sha="$GITHUB_SHA"
            base_ref="$GITHUB_REF_NAME"
            base_sha="$GITHUB_SHA"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ && "$base_sha" =~ ^[0-9a-f]{40}$ && "$event_sha" =~ ^[0-9a-f]{64}$ ]]
          git check-ref-format "refs/heads/$source_ref" >/dev/null
          git check-ref-format "refs/heads/$base_ref" >/dev/null
          jq -n -S \
            --arg event_name "$EVENT_NAME" --arg source_repository "$source_repository" \
            --arg source_ref "$source_ref" --arg source_sha "$source_sha" \
            --arg base_ref "$base_ref" --arg base_sha "$base_sha" \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg trigger_event_sha256 "$event_sha" \
            '{event_name:$event_name,source_repository:$source_repository,source_ref:$source_ref,source_sha:$source_sha,base_ref:$base_ref,base_sha:$base_sha,workflow_sha:$workflow_sha,trigger_event_sha256:$trigger_event_sha256}' \
            > "$root/source.json"
          [[ "$(jq -er '.trigger_event_sha256' "$root/source.json")" == "$event_sha" ]]
          {
            echo "source_sha=$source_sha"
            echo "base_sha=$base_sha"
            echo "artifact_name=gh-steward-dependency-remediation-capture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the event-bound source for credential-free verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.source.outputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Capture source diff and run its tests without credentials
        working-directory: source
        env:
          BASE_SHA: ${{ steps.source.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dependency-remediation-capture"
          git diff --binary "$BASE_SHA" "$SOURCE_SHA" -- > "$root/source.patch"
          env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY cargo test -p git-slop --all-targets --all-features --locked
          env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY cargo test --manifest-path xtask/Cargo.toml --all-targets --all-features --locked
          jq -n --arg sha "$SOURCE_SHA" \
            '{status:"passed",source_sha:$sha,credential_free:true,checks:["cargo test -p git-slop --all-targets --all-features --locked","cargo test --manifest-path xtask/Cargo.toml --all-targets --all-features --locked"]}' \
            > "$root/verification.json"

      - name: Upload immutable source verification handoff
        id: upload_capture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: ${{ runner.temp }}/dependency-remediation-capture
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  proposal:
    name: Propose remediation from bounded source evidence
    needs: [recover, capture]
    if: needs.recover.outputs.outcome == 'fresh' && needs.capture.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.collect.outputs.ready }}
      noop_reason: ${{ steps.collect.outputs.noop_reason || steps.disabled.outputs.noop_reason }}
      artifact_id: ${{ steps.upload_proposal.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_proposal.outputs.artifact-digest }}
      artifact_name: ${{ steps.collect.outputs.artifact_name }}
    steps:
      - name: Checkout trusted review controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate trusted Codex surface
        run: cargo xtask validate-codex

      - name: Verify immutable capture artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.capture.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.capture.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e --arg id "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" --arg digest "$ARTIFACT_DIGEST" \
            '.id == ($id|tonumber) and .name == $name and .digest == $digest and .expired == false' <<< "$metadata" >/dev/null

      - name: Download the exact source capture artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: ${{ runner.temp }}/dependency-remediation-source

      - name: Detect Codex credentials
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; no proposal or publication was attempted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Snapshot trusted Codex runtime inputs
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          trusted_root="$RUNNER_TEMP/dependency-remediation-trusted"
          codex_home="$RUNNER_TEMP/codex-runtime/.codex"
          mkdir -p "$trusted_root" "$codex_home/agents" "$RUNNER_TEMP/codex"
          cp .codex/config.toml "$codex_home/config.toml"
          sed -i 's/^approval_policy = "on-request"$/approval_policy = "never"/' "$codex_home/config.toml"
          cp .codex/*.config.toml "$codex_home/"
          cp -R .codex/agents/. "$codex_home/agents/"
          cp .github/codex/prompts/dependency-remediation.md "$trusted_root/dependency-remediation.md"
          cp .github/codex/schemas/dependency-remediation.json "$trusted_root/dependency-remediation.json"

      - name: Install pinned public Agent Plugins in the isolated Codex home
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-runtime/.codex"
          scripts/prepare-codex-plugins.sh "$RUNNER_TEMP/codex-runtime/.codex"

      - name: Run Codex over bounded patch and verification data only
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/dependency-remediation-trusted/dependency-remediation.md
          output-schema-file: ${{ runner.temp }}/dependency-remediation-trusted/dependency-remediation.json
          output-file: ${{ runner.temp }}/codex/dependency-remediation.json
          codex-home: ${{ runner.temp }}/codex-runtime/.codex
          codex-version: 0.160.0
          model: gpt-6-luna
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bot-users: dependabot[bot]

      - name: Collect exact Codex proposal and immutable handoff files
        id: collect
        if: steps.codex_preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/codex/dependency-remediation.json"
          [[ -s "$result" ]] || { echo 'Codex did not produce a bounded proposal.' >&2; exit 1; }
          jq -e 'type == "object" and .status == "patched" and (.supplemental_patch | type == "string" and length > 0)' "$result" >/dev/null || {
            echo "ready=false" >> "$GITHUB_OUTPUT"
            jq -e '.status == "noop"' "$result" >/dev/null || exit 1
            echo "noop_reason=no-change" >> "$GITHUB_OUTPUT"
            echo "Codex found no safe additional remediation; publication was skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          root="$RUNNER_TEMP/dependency-remediation-proposal"
          mkdir -p "$root/publication" "$root/events"
          cp -- "$RUNNER_TEMP/dependency-remediation-source/source.json" "$root/source.json"
          cp -- "$RUNNER_TEMP/dependency-remediation-source/source.patch" "$root/source.patch"
          cp -- "$RUNNER_TEMP/dependency-remediation-source/verification.json" "$root/source-verification.json"
          cp -- "$RUNNER_TEMP/dependency-remediation-source/events/trigger-event.json" "$root/events/trigger-event.json"
          jq -S . "$result" > "$root/publication/result.json"
          jq -jr '.supplemental_patch' "$root/publication/result.json" > "$root/publication/patch.diff"
          jq -e '.changed_files | type == "array" and length > 0 and all(.[]; type == "string") and (unique|length) == length' "$root/publication/result.json" >/dev/null
          jq -n -S \
            --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg capture_id "${{ needs.capture.outputs.artifact_id }}" \
            --arg capture_name "${{ needs.capture.outputs.artifact_name }}" \
            --arg capture_digest "${{ needs.capture.outputs.artifact_digest }}" \
            '{schema_version:1,workflow_sha:$workflow_sha,capture:{id:$capture_id,name:$capture_name,digest:$capture_digest}}' \
            > "$root/proposal.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "artifact_name=gh-steward-dependency-remediation-proposal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Record Codex-unavailable no-op
        id: disabled
        if: steps.codex_preflight.outputs.enabled != 'true'
        run: |
          echo "noop_reason=prerequisite-unavailable" >> "$GITHUB_OUTPUT"
          echo "No Codex API key is configured; no publication was attempted." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable proposal handoff
        id: upload_proposal
        if: steps.collect.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gh-steward-dependency-remediation-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-remediation-proposal
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  settle-noop:
    name: Settle an exact no-publication decision
    needs: [recover, capture, proposal, publish]
    if: always() && needs.recover.outputs.outcome == 'fresh' && needs.capture.result == 'success' && needs.proposal.result == 'success' && needs.proposal.outputs.ready != 'true' && needs.publish.result == 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted settlement tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Acquire attested gh-steward release
        run: scripts/with-gh-steward.sh --prepare

      - name: Verify pinned gh-steward receipt
        run: scripts/with-gh-steward.sh --verify

      - name: Verify and download exact source capture artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_ID: ${{ needs.capture.outputs.artifact_id }}
          CAPTURE_DIGEST: ${{ needs.capture.outputs.artifact_digest }}
          CAPTURE_NAME: ${{ needs.capture.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CAPTURE_ID" =~ ^[1-9][0-9]*$ && "$CAPTURE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CAPTURE_ID")"
          jq -e --arg id "$CAPTURE_ID" --arg digest "$CAPTURE_DIGEST" --arg name "$CAPTURE_NAME" \
            '.id == ($id|tonumber) and .digest == $digest and .name == $name and .expired == false' <<< "$metadata" >/dev/null

      - name: Download the exact source capture artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: ${{ runner.temp }}/dependency-remediation-noop-capture

      - name: Acquire the exact fresh recovery handoff
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF_ID: ${{ needs.recover.outputs.handoff_id }}
          HANDOFF_DIGEST: ${{ needs.recover.outputs.handoff_digest }}
          NOOP_DECISION: ${{ needs.proposal.outputs.noop_reason }}
          RUN_NAME: Dependency Remediation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HANDOFF_ID" =~ ^[1-9][0-9]*$ && "$HANDOFF_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$NOOP_DECISION" == no-change || "$NOOP_DECISION" == prerequisite-unavailable ]]
          "$GH_STEWARD_BIN" runs acquire-handoff \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --repo-root "$GITHUB_WORKSPACE" \
            --workflow dependency-remediation.yml --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-name "$RUN_NAME" --recovery-key workflow-history-v2 \
            --package-root "$RUNNER_TEMP/dependency-remediation-package" --runner-temp "$RUNNER_TEMP" \
            --policy .agents/gh-steward-recovery-policy.json \
            --purpose transport \
            --artifact-id "$HANDOFF_ID" --artifact-digest "$HANDOFF_DIGEST"
          root="$RUNNER_TEMP/dependency-remediation-package"
          capture="$RUNNER_TEMP/dependency-remediation-noop-capture"
          source="$capture/source.json"
          event="$capture/events/trigger-event.json"
          [[ -s "$source" && -s "$event" ]]
          cmp "$event" "$GITHUB_EVENT_PATH"
          event_sha="$(sha256sum "$event" | awk '{print $1}')"
          jq -e --arg event "$GITHUB_EVENT_NAME" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" --arg event_sha "$event_sha" \
            '.event_name == $event and .workflow_sha == $workflow_sha and .trigger_event_sha256 == $event_sha and (.source_sha | test("^[0-9a-f]{40}$")) and (.base_sha | test("^[0-9a-f]{40}$"))' \
            "$source" >/dev/null
          install -d -m 0700 "$root/events" "$root/decisions"
          cp -- "$event" "$root/events/trigger-event.json"
          target="$(jq -cS --arg event_sha "$event_sha" --arg source_sha "$(jq -er '.source_sha' "$source")" --arg base_sha "$(jq -er '.base_sha' "$source")" \
            '{trigger_event_sha256:$event_sha,source_sha:$source_sha,base_sha:$base_sha}')"
          jq -n -S --arg repository "$GITHUB_REPOSITORY" --arg workflow_file dependency-remediation.yml \
            --arg recovery_key workflow-history-v2 --arg run_name "$RUN_NAME" \
            --arg trusted_source_sha "$GITHUB_WORKFLOW_SHA" --argjson run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --argjson target "$target" \
            '{repository:$repository,workflow_file:$workflow_file,recovery_key:$recovery_key,run_name:$run_name,run_id:$run,attempt:$attempt,attempt_target:$target,dispatch_steps:[],trusted_source_sha:$trusted_source_sha}' \
            > "$RUNNER_TEMP/dependency-remediation-noop-context.json"
          "$GH_STEWARD_BIN" runs context-start \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --repo-root "$GITHUB_WORKSPACE" \
            --policy .agents/gh-steward-recovery-policy.json --package-root "$root" \
            --runner-temp "$RUNNER_TEMP" \
            --input context="$RUNNER_TEMP/dependency-remediation-noop-context.json" \
            > "$RUNNER_TEMP/dependency-remediation-noop-context-envelope.json"
          "$GH_STEWARD_BIN" runs context-phase \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --repo-root "$GITHUB_WORKSPACE" \
            --policy .agents/gh-steward-recovery-policy.json --package-root "$root" \
            --runner-temp "$RUNNER_TEMP" --phase prepared \
            --reason "dependency remediation proposal ended without a verified candidate" \
            > "$RUNNER_TEMP/dependency-remediation-noop-phase-envelope.json"
          jq -n -S --arg decision "$NOOP_DECISION" --arg repo "$GITHUB_REPOSITORY" \
            --arg server_url "$GITHUB_SERVER_URL" --arg workflow_file dependency-remediation.yml \
            --arg recovery_key workflow-history-v2 --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" --arg event_sha "$event_sha" --argjson target "$target" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema_version:1,decision:$decision,repository:$repo,server_url:$server_url,workflow_file:$workflow_file,run_id:$run,attempt:$attempt,recovery_key:$recovery_key,attempt_target:$target,workflow_sha:$workflow_sha,event_name:$event_name,event_sha256:$event_sha}' \
            > "$root/decisions/workflow-noop.json"
          "$GH_STEWARD_BIN" runs finish-noop \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --repo-root "$GITHUB_WORKSPACE" \
            --workflow dependency-remediation.yml --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-name "$RUN_NAME" --recovery-key workflow-history-v2 \
            --package-root "$root" --runner-temp "$RUNNER_TEMP" \
            --policy .agents/gh-steward-recovery-policy.json --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            > "$RUNNER_TEMP/dependency-remediation-workflow-noop-envelope.json"

      - name: Upload exact terminal dependency no-op artifact
        id: noop_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.recover.outputs.artifact_name }}
          path: ${{ runner.temp }}/dependency-remediation-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Finalize exact dependency no-op checkpoint
        id: noop_checkpoint
        if: steps.noop_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.noop_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.noop_artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/finalize-gh-steward-run.sh \
            --workflow dependency-remediation.yml --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --package "$RUNNER_TEMP/dependency-remediation-package" \
            --checkpoint "$RUNNER_TEMP/dependency-remediation-checkpoint" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

      - name: Upload exact dependency no-op settlement checkpoint
        if: steps.noop_checkpoint.outcome == 'success' && steps.noop_checkpoint.outputs.outcome == 'checkpoint'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.noop_checkpoint.outputs.checkpoint_name }}
          path: ${{ steps.noop_checkpoint.outputs.checkpoint_path }}
          if-no-files-found: error
          retention-days: 90

  verify-candidate:
    name: Verify publication candidate without credentials
    needs: [recover, capture, proposal]
    if: needs.recover.outputs.outcome == 'fresh' && needs.proposal.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_candidate.outputs.artifact-digest }}
      artifact_name: ${{ steps.upload_candidate.outputs.artifact-name }}
    steps:
      - name: Checkout trusted verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Verify upstream artifact identities and extract bounded source metadata
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_ID: ${{ needs.capture.outputs.artifact_id }}
          CAPTURE_NAME: ${{ needs.capture.outputs.artifact_name }}
          CAPTURE_DIGEST: ${{ needs.capture.outputs.artifact_digest }}
          PROPOSAL_ID: ${{ needs.proposal.outputs.artifact_id }}
          PROPOSAL_NAME: ${{ needs.proposal.outputs.artifact_name }}
          PROPOSAL_DIGEST: ${{ needs.proposal.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          for tuple in "$CAPTURE_ID:$CAPTURE_DIGEST" "$PROPOSAL_ID:$PROPOSAL_DIGEST"; do
            artifact_id="${tuple%%:*}"
            artifact_digest="${tuple#*:}"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ && "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
            case "$artifact_id" in
              "$CAPTURE_ID") expected_name="$CAPTURE_NAME" ;;
              *) expected_name="$PROPOSAL_NAME" ;;
            esac
            jq -e --arg id "$artifact_id" --arg name "$expected_name" --arg digest "$artifact_digest" \
              '.id == ($id|tonumber) and .name == $name and .digest == $digest and .expired == false' <<< "$actual" >/dev/null
          done
          [[ "$CAPTURE_ID" != "$PROPOSAL_ID" ]]
          [[ -n "$CAPTURE_NAME" && -n "$PROPOSAL_NAME" ]]
          mkdir -p "$RUNNER_TEMP/capture-artifact" "$RUNNER_TEMP/proposal-artifact"

      - name: Download exact capture artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: ${{ runner.temp }}/capture-artifact

      - name: Download exact proposal artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7
        with:
          artifact-ids: ${{ needs.proposal.outputs.artifact_id }}
          path: ${{ runner.temp }}/proposal-artifact

      - name: Validate exact source binding and candidate patch scope
        id: validated_source
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.ref_name }}
          BASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/dependency-remediation-paths.sh"
          capture="$RUNNER_TEMP/capture-artifact"
          proposal="$RUNNER_TEMP/proposal-artifact"
          cmp "$capture/source.json" "$proposal/source.json"
          cmp "$capture/source.patch" "$proposal/source.patch"
          cmp "$capture/verification.json" "$proposal/source-verification.json"
          cmp "$capture/events/trigger-event.json" "$proposal/events/trigger-event.json"
          jq -e --arg event "$GITHUB_EVENT_NAME" --arg sha "$GITHUB_WORKFLOW_SHA" \
            '.event_name == $event and .workflow_sha == $sha and (.source_sha | type == "string" and test("^[0-9a-f]{40}$")) and (.base_sha | type == "string" and test("^[0-9a-f]{40}$")) and .source_repository == env.GITHUB_REPOSITORY' \
            "$capture/source.json" >/dev/null
          event_sha="$(sha256sum "$capture/events/trigger-event.json" | awk '{print $1}')"
          [[ "$(jq -er '.trigger_event_sha256' "$capture/source.json")" == "$event_sha" ]]
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg source_ref "$(jq -er '.source_ref' "$capture/source.json")" \
              --arg source_sha "$(jq -er '.source_sha' "$capture/source.json")" \
              --arg base_ref "$(jq -er '.base_ref' "$capture/source.json")" \
              --arg base_sha "$(jq -er '.base_sha' "$capture/source.json")" \
              '.pull_request.head.repo.full_name == $repo and .pull_request.base.repo.full_name == $repo and .pull_request.head.ref == $source_ref and .pull_request.head.sha == $source_sha and .pull_request.base.ref == $base_ref and .pull_request.base.sha == $base_sha' \
              "$capture/events/trigger-event.json" >/dev/null
          else
            jq -e --arg ref "$BASE_REF" --arg sha "$BASE_SHA" \
              '.source_ref == $ref and .source_sha == $sha and .base_ref == $ref and .base_sha == $sha' \
              "$capture/source.json" >/dev/null
          fi
          jq -e --slurpfile source "$capture/source.json" \
            '.status == "passed" and .credential_free == true and .source_sha == $source[0].source_sha' \
            "$capture/verification.json" >/dev/null
          dependency_remediation_validate_result_paths "$proposal/publication/result.json"
          [[ "$(jq -er '.status' "$proposal/publication/result.json")" == patched ]]
          source_sha="$(jq -er '.source_sha' "$capture/source.json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact event-bound source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.validated_source.outputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Apply exact supplemental patch and verify the complete candidate
        id: verify
        working-directory: candidate
        env:
          BASE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_SHA: ${{ steps.validated_source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/scripts/dependency-remediation-paths.sh"
          proposal="$RUNNER_TEMP/proposal-artifact"
          patch="$proposal/publication/patch.diff"
          result="$proposal/publication/result.json"
          git -c core.hooksPath=/dev/null apply --cached --check --binary "$patch"
          git -c core.hooksPath=/dev/null apply --cached --binary "$patch"
          expected_files="$(jq -cS '.changed_files | sort' "$result")"
          actual_files="$(dependency_remediation_git_file_list_json "$SOURCE_SHA")"
          jq -e --argjson expected "$expected_files" --argjson actual "$actual_files" '$expected == $actual' >/dev/null
          tree_before="$(git write-tree)"
          env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY cargo test -p git-slop --all-targets --all-features --locked
          env -u GH_TOKEN -u GITHUB_TOKEN -u OPENAI_API_KEY cargo test --manifest-path xtask/Cargo.toml --all-targets --all-features --locked
          [[ -z "$(git diff --name-only)" ]] || { echo 'candidate tests modified tracked source files' >&2; exit 1; }
          tree_after="$(git write-tree)"
          [[ "$tree_before" == "$tree_after" ]]
          echo "candidate_tree_sha=$tree_after" >> "$GITHUB_OUTPUT"

      - name: Create exact publication candidate evidence
        id: candidate_evidence
        env:
          CAPTURE_ID: ${{ needs.capture.outputs.artifact_id }}
          CAPTURE_NAME: ${{ needs.capture.outputs.artifact_name }}
          CAPTURE_DIGEST: ${{ needs.capture.outputs.artifact_digest }}
          PROPOSAL_ID: ${{ needs.proposal.outputs.artifact_id }}
          PROPOSAL_NAME: ${{ needs.proposal.outputs.artifact_name }}
          PROPOSAL_DIGEST: ${{ needs.proposal.outputs.artifact_digest }}
          CANDIDATE_TREE: ${{ steps.verify.outputs.candidate_tree_sha }}
        run: |
          set -euo pipefail
          [[ "$CAPTURE_ID" =~ ^[1-9][0-9]*$ && "$PROPOSAL_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CAPTURE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$PROPOSAL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          package="$RUNNER_TEMP/dependency-remediation-candidate"
          mkdir -p "$package/publication" "$package/events"
          cp -- "$RUNNER_TEMP/proposal-artifact/publication/patch.diff" "$package/publication/patch.diff"
          cp -- "$RUNNER_TEMP/proposal-artifact/publication/result.json" "$package/publication/result.json"
          cp -- "$RUNNER_TEMP/proposal-artifact/events/trigger-event.json" "$package/events/trigger-event.json"
          event_sha="$(sha256sum "$package/events/trigger-event.json" | awk '{print $1}')"
          patch_sha="$(sha256sum "$package/publication/patch.diff" | awk '{print $1}')"
          result_sha="$(sha256sum "$package/publication/result.json" | awk '{print $1}')"
          source="$RUNNER_TEMP/capture-artifact/source.json"
          jq -n -S \
            --arg repository "$GITHUB_REPOSITORY" --arg server_url "$GITHUB_SERVER_URL" \
            --arg workflow_file dependency-remediation.yml --argjson run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg workflow_sha "$GITHUB_WORKFLOW_SHA" \
            --arg event_name "$GITHUB_EVENT_NAME" --arg event_sha "$event_sha" \
            --arg source_repository "$(jq -er '.source_repository' "$source")" \
            --arg source_ref "$(jq -er '.source_ref' "$source")" --arg source_sha "$(jq -er '.source_sha' "$source")" \
            --arg base_ref "$(jq -er '.base_ref' "$source")" --arg base_sha "$(jq -er '.base_sha' "$source")" \
            --arg candidate_tree "$CANDIDATE_TREE" --arg patch_sha "$patch_sha" --arg result_sha "$result_sha" \
            --argjson capture_id "$CAPTURE_ID" --arg capture_name "$CAPTURE_NAME" --arg capture_digest "$CAPTURE_DIGEST" \
            --argjson proposal_id "$PROPOSAL_ID" --arg proposal_name "$PROPOSAL_NAME" --arg proposal_digest "$PROPOSAL_DIGEST" \
            '{schema_version:1,repository:$repository,server_url:$server_url,workflow_file:$workflow_file,origin_run_id:$run,origin_run_attempt:$attempt,workflow_sha:$workflow_sha,event_name:$event_name,trigger_event_sha256:$event_sha,source_repository:$source_repository,source_ref:$source_ref,source_sha:$source_sha,base_ref:$base_ref,base_sha:$base_sha,candidate_tree_sha:$candidate_tree,patch_sha256:$patch_sha,result_sha256:$result_sha,upstream_artifacts:{capture:{id:$capture_id,name:$capture_name,digest:$capture_digest},proposal:{id:$proposal_id,name:$proposal_name,digest:$proposal_digest}},verification_job_name:"Verify publication candidate"}' \
            > "$package/publication/candidate.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_WORKFLOW_SHA" \
            '.repository == $repo and .workflow_sha == $sha and (.source_sha | test("^[0-9a-f]{40}$")) and (.base_sha | test("^[0-9a-f]{40}$")) and (.candidate_tree_sha | test("^[0-9a-f]{40}$")) and (.trigger_event_sha256 | test("^[0-9a-f]{64}$")) and (.patch_sha256 | test("^[0-9a-f]{64}$")) and (.result_sha256 | test("^[0-9a-f]{64}$")) and (.upstream_artifacts.capture.id | type == "number" and . > 0 and floor == .) and (.upstream_artifacts.proposal.id | type == "number" and . > 0 and floor == .)' \
            "$package/publication/candidate.json" >/dev/null
          echo "artifact_name=gh-steward-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload exact immutable candidate handoff
        id: upload_candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gh-steward-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-remediation-candidate/publication/candidate.json
            ${{ runner.temp }}/dependency-remediation-candidate/publication/patch.diff
            ${{ runner.temp }}/dependency-remediation-candidate/publication/result.json
            ${{ runner.temp }}/dependency-remediation-candidate/events/trigger-event.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish only the verified candidate
    needs: [recover, capture, proposal, verify-candidate]
    if: always() && needs.recover.result == 'success' && contains(fromJSON('["fresh","resumed","terminal"]'), needs.recover.outputs.outcome) && (needs.recover.outputs.outcome != 'fresh' || (needs.proposal.result == 'success' && needs.proposal.outputs.ready == 'true' && needs.verify-candidate.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate trusted publisher contracts
        run: cargo xtask validate-codex

      - name: Pin the immutable trusted control worktree
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/gh-steward-control"
          git worktree add --detach "$control" "$GITHUB_WORKFLOW_SHA"
          [[ "$(git -C "$control" rev-parse HEAD)" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ -z "$(git -C "$control" status --porcelain)" ]]
          printf 'GH_STEWARD_TRUSTED_ROOT=%s\n' "$control" >> "$GITHUB_ENV"

      - name: Acquire attested gh-steward release
        run: scripts/with-gh-steward.sh --prepare

      - name: Verify pinned gh-steward receipt
        run: scripts/with-gh-steward.sh --verify

      - name: Acquire and verify the exact native recovery handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_OUTCOME: ${{ needs.recover.outputs.outcome }}
          HANDOFF_ID: ${{ needs.recover.outputs.handoff_id }}
          HANDOFF_DIGEST: ${{ needs.recover.outputs.handoff_digest }}
          RUN_NAME: Dependency Remediation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HANDOFF_ID" =~ ^[1-9][0-9]*$ && "$HANDOFF_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          "$GH_STEWARD_BIN" runs acquire-handoff \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --repo-root "$GITHUB_WORKSPACE" \
            --workflow dependency-remediation.yml --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-name "$RUN_NAME" --recovery-key workflow-history-v2 \
            --package-root "$RUNNER_TEMP/dependency-remediation-package" --runner-temp "$RUNNER_TEMP" \
            --policy .agents/gh-steward-recovery-policy.json --artifact-id "$HANDOFF_ID" \
            --artifact-digest "$HANDOFF_DIGEST" --purpose transport
          case "$RECOVERY_OUTCOME" in
            fresh|terminal)
              [[ -s "$RUNNER_TEMP/dependency-remediation-package/settlement-chain.json" ]]
              [[ ! -e "$RUNNER_TEMP/dependency-remediation-package/run-context.json" ]]
              ;;
            resumed)
              [[ -s "$RUNNER_TEMP/dependency-remediation-package/settlement-chain.json" ]]
              [[ -s "$RUNNER_TEMP/dependency-remediation-package/run-context.json" ]]
              [[ -s "$RUNNER_TEMP/dependency-remediation-package/recovery-source.json" ]]
              ;;
            *) echo "unexpected recovery outcome: $RECOVERY_OUTCOME" >&2; exit 1 ;;
          esac

      - name: Copy immutable trusted publication adapter before source checkout
        run: |
          install -d -m 0700 "$RUNNER_TEMP/trusted-dependency-publisher"
          install -m 0700 "$GH_STEWARD_TRUSTED_ROOT/scripts/dependency-remediation-publish.sh" "$RUNNER_TEMP/trusted-dependency-publisher/dependency-remediation-publish.sh"
          install -m 0600 "$GH_STEWARD_TRUSTED_ROOT/scripts/dependency-remediation-paths.sh" "$RUNNER_TEMP/trusted-dependency-publisher/dependency-remediation-paths.sh"
          install -m 0700 "$GH_STEWARD_TRUSTED_ROOT/scripts/finalize-gh-steward-run.sh" "$RUNNER_TEMP/trusted-dependency-publisher/finalize-gh-steward-run.sh"

      - name: Acquire the exact credential-free verified candidate
        if: needs.recover.outputs.outcome == 'fresh' && needs.proposal.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify-candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.verify-candidate.outputs.artifact_digest }}
          RUN_NAME: Dependency Remediation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          "$GH_STEWARD_BIN" runs acquire-publication-candidate \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --repo-root "$GH_STEWARD_TRUSTED_ROOT" \
            --policy .agents/gh-steward-recovery-policy.json \
            --workflow dependency-remediation.yml \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-name "$RUN_NAME" --recovery-key workflow-history-v2 \
            --package-root "$RUNNER_TEMP/dependency-remediation-package" \
            --runner-temp "$RUNNER_TEMP" --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"

      - name: Record trusted workflow start time
        id: run_identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at | sub("\\.[0-9]+Z$"; "Z")')"
          [[ "$started_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Create fresh run context from verified candidate
        if: needs.recover.outputs.outcome == 'fresh' && needs.proposal.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dependency-remediation-package"
          candidate="$root/publication/candidate.json"
          event_sha="$(sha256sum "$root/events/trigger-event.json" | awk '{print $1}')"
          jq -n -S --arg repository "$GITHUB_REPOSITORY" --arg workflow_file dependency-remediation.yml \
            --arg recovery_key workflow-history-v2 --arg run_name 'Dependency Remediation' \
            --arg trusted_source_sha "$GITHUB_WORKFLOW_SHA" --arg source_sha "$(jq -er '.source_sha' "$candidate")" \
            --arg base_sha "$(jq -er '.base_sha' "$candidate")" --arg event_sha "$event_sha" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '{workflow_file:$workflow_file,repository:$repository,recovery_key:$recovery_key,run_name:$run_name,run_id:$run,attempt:$attempt,attempt_target:{source_sha:$source_sha,base_sha:$base_sha,trigger_event_sha256:$event_sha},dispatch_steps:[],trusted_source_sha:$trusted_source_sha}' \
            > "$RUNNER_TEMP/dependency-remediation-context.json"
          "$GH_STEWARD_BIN" runs context-start \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --repo-root "$GH_STEWARD_TRUSTED_ROOT" \
            --policy .agents/gh-steward-recovery-policy.json \
            --package-root "$root" --runner-temp "$RUNNER_TEMP" \
            --input context="$RUNNER_TEMP/dependency-remediation-context.json" \
            > "$RUNNER_TEMP/dependency-remediation-context-envelope.json"

      - name: Prepare exact publication intent
        if: needs.recover.outputs.outcome == 'fresh' && needs.proposal.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ROOT: ${{ runner.temp }}/dependency-remediation-package
          WORKFLOW_FILE: dependency-remediation.yml
          WORKFLOW_RUN_NAME: Dependency Remediation
          RECOVERY_KEY: workflow-history-v2
          WORKFLOW_RUN_STARTED_AT: ${{ steps.run_identity.outputs.started_at }}
        run: |
          "$RUNNER_TEMP/trusted-dependency-publisher/dependency-remediation-publish.sh" prepare "$PACKAGE_ROOT"

      - name: Verify the exact publication candidate before any write
        if: (needs.recover.outputs.outcome == 'fresh' && needs.proposal.outputs.ready == 'true') || needs.recover.outputs.outcome == 'resumed'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: Dependency Remediation
        run: |
          set -euo pipefail
          "$GH_STEWARD_BIN" runs verify-publication \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --repo-root "$GH_STEWARD_TRUSTED_ROOT" \
            --package-root "$RUNNER_TEMP/dependency-remediation-package" \
            --policy .agents/gh-steward-recovery-policy.json \
            --workflow dependency-remediation.yml \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --run-name "$RUN_NAME" --recovery-key workflow-history-v2 \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" --format json

      - name: Continue only the exact positively recoverable publication stage
        if: (needs.recover.outputs.outcome == 'fresh' && needs.proposal.outputs.ready == 'true') || needs.recover.outputs.outcome == 'resumed'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ROOT: ${{ runner.temp }}/dependency-remediation-package
          WORKFLOW_FILE: dependency-remediation.yml
          WORKFLOW_RUN_NAME: Dependency Remediation
          RECOVERY_KEY: workflow-history-v2
          WORKFLOW_RUN_STARTED_AT: ${{ steps.run_identity.outputs.started_at }}
        run: |
          "$RUNNER_TEMP/trusted-dependency-publisher/dependency-remediation-publish.sh" continue "$PACKAGE_ROOT"

      - name: Upload exact dependency-remediation recovery artifact
        if: always() && needs.recover.outputs.artifact_name != '' && needs.recover.outputs.outcome != 'recovery_needed'
        id: terminal_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ needs.recover.outputs.artifact_name }}
          path: ${{ runner.temp }}/dependency-remediation-package
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Check whether this observer has a current finalizer context
        id: finalizer_context
        if: always() && steps.terminal_artifact.outcome == 'success'
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/dependency-remediation-package/run-context.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Finalize exact terminal publication checkpoint
        id: finalize_checkpoint
        if: always() && steps.terminal_artifact.outcome == 'success' && steps.terminal_artifact.outputs.artifact-id != '' && steps.finalizer_context.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.terminal_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.terminal_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          args=(--workflow dependency-remediation.yml --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --package "$RUNNER_TEMP/dependency-remediation-package" \
            --checkpoint "$RUNNER_TEMP/dependency-remediation-checkpoint" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST")
          if [ -f "$RUNNER_TEMP/dependency-remediation-package/recovery-source.json" ]; then
            args+=(--recovery-source recovery-source.json)
          fi
          GH_STEWARD_TRUSTED_ROOT="$GH_STEWARD_TRUSTED_ROOT" \
            "$RUNNER_TEMP/trusted-dependency-publisher/finalize-gh-steward-run.sh" "${args[@]}"

      - name: Upload exact publication settlement checkpoint
        if: always() && steps.finalize_checkpoint.outcome == 'success' && steps.finalize_checkpoint.outputs.outcome == 'checkpoint'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.finalize_checkpoint.outputs.checkpoint_name }}
          path: ${{ steps.finalize_checkpoint.outputs.checkpoint_path }}
          if-no-files-found: error
          retention-days: 90
