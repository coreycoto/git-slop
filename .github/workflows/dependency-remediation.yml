name: Dependency Remediation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "35 11 * * 2"
  workflow_dispatch:

jobs:
  remediate:
    name: Trusted dependency remediation
    if: github.event_name != 'pull_request_target' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: read
    steps:
      - name: Checkout trusted workflow tooling
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate trusted Codex surface
        run: cargo xtask validate-codex

      - name: Detect Codex credentials
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex remediation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        env:
          AGENT_PLUGINS_READ_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: scripts/with-agent-plugins.sh --prepare

      - name: Verify pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: scripts/with-agent-plugins.sh --verify

      - name: Snapshot trusted Codex runtime inputs
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          trusted_root="$RUNNER_TEMP/dependency-remediation-trusted"
          codex_home="$RUNNER_TEMP/codex-runtime/.codex"
          mkdir -p "$trusted_root" "$codex_home/agents"
          cp .codex/config.toml "$codex_home/config.toml"
          cp .codex/*.config.toml "$codex_home/"
          cp -R .codex/agents/. "$codex_home/agents/"
          cp .github/codex/prompts/dependency-remediation.md \
            "$trusted_root/dependency-remediation.md"
          cp .github/codex/schemas/dependency-remediation.json \
            "$trusted_root/dependency-remediation.json"

      - name: Install pinned marketplace from trusted tooling
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-runtime/.codex"
          scripts/with-agent-plugins.sh marketplace install \
            --manifest .agents/plugins/marketplace-source.json \
            --home "$RUNNER_TEMP/codex-runtime"

      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Configure git author
        run: |
          git config user.name "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"

      - name: Prepare remediation artifacts
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: mkdir -p .artifacts/codex .artifacts/dependency-remediation

      - name: Run Codex dependency remediation
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/dependency-remediation-trusted/dependency-remediation.md
          output-schema-file: ${{ runner.temp }}/dependency-remediation-trusted/dependency-remediation.json
          output-file: .artifacts/codex/dependency-remediation.json
          codex-home: ${{ runner.temp }}/codex-runtime/.codex
          codex-args: >-
            ["--profile","ci_mutation"]
          safety-strategy: drop-sudo
          sandbox: workspace-write
          allow-bot-users: dependabot[bot]

      - name: Preserve Codex failure diagnostic
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        env:
          CODEX_OUTCOME: ${{ steps.run_codex.outcome }}
        run: |
          if [ ! -s .artifacts/codex/dependency-remediation.json ]; then
            jq -n \
              --arg outcome "${CODEX_OUTCOME:-not-run}" \
              --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{status: "codex_output_unavailable", outcome: $outcome, run_url: $run_url}' \
              > .artifacts/dependency-remediation/codex-failure.json
          fi

      - name: Publish structured summary
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        run: |
          if [ -f .artifacts/codex/dependency-remediation.json ]; then
            {
              echo '```json'
              jq . .artifacts/codex/dependency-remediation.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload remediation artifacts
        if: ${{ always() && steps.codex_preflight.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-remediation-artifacts
          path: |
            .artifacts/codex/dependency-remediation.json
            .artifacts/dependency-remediation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
