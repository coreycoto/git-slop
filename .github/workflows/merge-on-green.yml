name: Merge On Green

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  merge:
    name: Merge eligible automation PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preflight eligible merge candidate
        id: merge_preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          finish() {
            local eligible="$1"
            local reason="$2"
            local pr_number="${3:-}"
            {
              echo "eligible=$eligible"
              echo "pr_number=$pr_number"
            } >> "$GITHUB_OUTPUT"
            echo "Merge preflight: $reason" >> "$GITHUB_STEP_SUMMARY"
            echo "$reason"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            finish true "manual dispatch requested; running merge gate"
            exit 0
          fi

          if [ "$(jq -r '.workflow_run.conclusion // ""' "$EVENT_PATH")" != "success" ]; then
            finish false "CI workflow_run was not successful; skipping Codex merge gate"
            exit 0
          fi

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$EVENT_PATH")"
          head_sha="$(jq -r '.workflow_run.head_sha // empty' "$EVENT_PATH")"
          if [ -z "$pr_number" ] && [ -n "$head_sha" ]; then
            associated_prs=""
            if associated_prs="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${REPOSITORY}/commits/${head_sha}/pulls"
            )"; then
              pr_number="$(jq -r '.[0].number // empty' <<< "$associated_prs")"
            fi
          fi
          if [ -z "$pr_number" ]; then
            finish false "CI workflow_run has no associated pull request; skipping Codex"
            exit 0
          fi

          if ! pr_json="$(
            gh pr view "$pr_number" \
              --repo "$REPOSITORY" \
              --json headRefName,labels
          )"; then
            finish false "could not inspect PR #${pr_number}; skipping Codex"
            exit 0
          fi

          branch="$(jq -r '.headRefName // ""' <<< "$pr_json")"
          if [[ "$branch" != codex/* ]]; then
            finish false "PR #${pr_number} branch is not codex/*; skipping Codex" "$pr_number"
            exit 0
          fi
          if ! jq -e '(.labels // []) | any(.name == "auto-merge")' \
            <<< "$pr_json" >/dev/null; then
            finish false "PR #${pr_number} lacks auto-merge label; skipping Codex" "$pr_number"
            exit 0
          fi

          finish true "PR #${pr_number} passed cheap eligibility preflight" "$pr_number"

      - name: Set up Rust
        if: steps.merge_preflight.outputs.eligible == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate Codex surface
        if: steps.merge_preflight.outputs.eligible == 'true'
        run: cargo xtask validate-codex

      - name: Detect Codex credentials
        if: steps.merge_preflight.outputs.eligible == 'true'
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex merge gate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        env:
          AGENT_PLUGINS_READ_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: scripts/with-agent-plugins.sh --prepare

      - name: Verify pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: scripts/with-agent-plugins.sh --verify

      - name: Prepare pinned Codex runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          mkdir -p .artifacts/codex "$RUNNER_TEMP/codex-runtime/.codex"
          cp .codex/config.toml "$RUNNER_TEMP/codex-runtime/.codex/config.toml"
          cp .codex/*.config.toml "$RUNNER_TEMP/codex-runtime/.codex/"
          scripts/with-agent-plugins.sh marketplace install \
            --manifest .agents/plugins/marketplace-source.json \
            --home "$RUNNER_TEMP/codex-runtime"

      - name: Run Codex merge gate
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/merge-on-green.md
          output-file: .artifacts/codex/merge-on-green.json
          codex-home: ${{ runner.temp }}/codex-runtime/.codex
          codex-args: >-
            ["--profile","ci_mutation","--model","gpt-5.6-luna","--output-schema",".github/codex/schemas/merge-on-green.json"]
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Publish structured summary
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        run: |
          if [ -f .artifacts/codex/merge-on-green.json ]; then
            {
              echo '```json'
              jq . .artifacts/codex/merge-on-green.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merge-gate artifacts
        if: ${{ always() && steps.merge_preflight.outputs.eligible == 'true' && steps.codex_preflight.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: merge-on-green-artifacts
          path: .artifacts/codex/merge-on-green.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
