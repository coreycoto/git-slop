name: Merge On Green

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  merge:
    name: Merge eligible automation PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preflight eligible merge candidate
        id: merge_preflight
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def finish(eligible: bool, reason: str, pr_number: str = "") -> None:
              with output_path.open("a", encoding="utf-8") as output:
                  output.write(f"eligible={'true' if eligible else 'false'}\n")
                  output.write(f"pr_number={pr_number}\n")
              with summary_path.open("a", encoding="utf-8") as summary:
                  summary.write(f"Merge preflight: {reason}\n")
              print(reason)

          if event_name == "workflow_dispatch":
              finish(True, "manual dispatch requested; running merge gate")
              sys.exit(0)

          workflow_run = event.get("workflow_run") or {}
          if workflow_run.get("conclusion") != "success":
              finish(False, "CI workflow_run was not successful; skipping Codex merge gate")
              sys.exit(0)

          pull_requests = workflow_run.get("pull_requests") or []
          pr_number = str(pull_requests[0].get("number")) if pull_requests else ""
          if not pr_number and workflow_run.get("head_sha"):
              completed = subprocess.run(
                  [
                      "gh",
                      "api",
                      "-H",
                      "Accept: application/vnd.github+json",
                      f"repos/{os.environ['REPOSITORY']}/commits/{workflow_run['head_sha']}/pulls",
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if completed.returncode == 0:
                  associated_prs = json.loads(completed.stdout)
                  if associated_prs:
                      pr_number = str(associated_prs[0].get("number") or "")
          if not pr_number:
              finish(False, "CI workflow_run has no associated pull request; skipping Codex")
              sys.exit(0)

          completed = subprocess.run(
              [
                  "gh",
                  "pr",
                  "view",
                  pr_number,
                  "--repo",
                  os.environ["REPOSITORY"],
                  "--json",
                  "headRefName,labels",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          if completed.returncode != 0:
              finish(False, f"could not inspect PR #{pr_number}; skipping Codex")
              sys.exit(0)

          pr = json.loads(completed.stdout)
          branch = pr.get("headRefName") or ""
          labels = {label.get("name") for label in pr.get("labels", [])}
          if not branch.startswith("codex/"):
              finish(False, f"PR #{pr_number} branch is not codex/*; skipping Codex", pr_number)
              sys.exit(0)
          if "auto-merge" not in labels:
              finish(False, f"PR #{pr_number} lacks auto-merge label; skipping Codex", pr_number)
              sys.exit(0)

          finish(True, f"PR #{pr_number} passed cheap eligibility preflight", pr_number)
          PY

      - name: Set up Python
        if: steps.merge_preflight.outputs.eligible == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.merge_preflight.outputs.eligible == 'true'
        run: python -m pip install --upgrade pip uv

      - name: Configure agent-plugins dependency access
        if: steps.merge_preflight.outputs.eligible == 'true'
        env:
          AGENT_PLUGINS_GIT_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_PLUGINS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_PLUGINS_GIT_TOKEN}@github.com/coreycoto/agent-plugins.git".insteadOf "https://github.com/coreycoto/agent-plugins.git"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-plugins.git >/dev/null 2>&1; then
            echo "agent-plugins is publicly readable; no extra git auth configured."
          else
            echo "coreycoto/agent-plugins is private and cannot be fetched from CI without a token." >&2
            echo "Set AGENT_PLUGINS_READ_TOKEN with read access to coreycoto/agent-plugins, or make the repo public." >&2
            exit 1
          fi
      - name: Sync project
        if: steps.merge_preflight.outputs.eligible == 'true'
        run: uv sync --group dev --group maintainer

      - name: Bootstrap agent-plugins marketplace source
        if: steps.merge_preflight.outputs.eligible == 'true'
        run: uv run python scripts/bootstrap_agent_plugins_marketplace.py install

      - name: Validate Codex surface
        if: steps.merge_preflight.outputs.eligible == 'true'
        run: uv run python scripts/validate_codex_surface.py

      - name: Detect Codex credentials
        if: steps.merge_preflight.outputs.eligible == 'true'
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex merge gate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Codex runtime directories
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          mkdir -p .artifacts/codex "$RUNNER_TEMP/codex-home"
          cp .codex/config.toml "$RUNNER_TEMP/codex-home/config.toml"

      - name: Run Codex merge gate
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/merge-on-green.md
          output-file: .artifacts/codex/merge-on-green.json
          codex-home: ${{ runner.temp }}/codex-home
          codex-args: >-
            ["--profile","ci_mutation","--model","gpt-5.4-nano","--output-schema",".github/codex/schemas/merge-on-green.json"]
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Publish structured summary
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        run: |
          if [ -f .artifacts/codex/merge-on-green.json ]; then
            {
              echo '```json'
              python -m json.tool .artifacts/codex/merge-on-green.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merge-gate artifacts
        if: steps.merge_preflight.outputs.eligible == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-on-green-artifacts
          path: .artifacts
          if-no-files-found: warn
