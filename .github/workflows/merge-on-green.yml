name: Merge On Green

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  merge:
    name: Merge eligible automation PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Configure agent-plugins dependency access
        env:
          AGENT_PLUGINS_GIT_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_PLUGINS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_PLUGINS_GIT_TOKEN}@github.com/coreycoto/agent-plugins.git".insteadOf "https://github.com/coreycoto/agent-plugins.git"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-plugins.git >/dev/null 2>&1; then
            echo "agent-plugins is publicly readable; no extra git auth configured."
          else
            echo "coreycoto/agent-plugins is private and cannot be fetched from CI without a token." >&2
            echo "Set AGENT_PLUGINS_READ_TOKEN with read access to coreycoto/agent-plugins, or make the repo public." >&2
            exit 1
          fi
      - name: Sync project
        run: uv sync --group dev

      - name: Bootstrap agent-plugins marketplace source
        run: uv run python scripts/bootstrap_agent_plugins_marketplace.py install

      - name: Validate Codex surface
        run: uv run python scripts/validate_codex_surface.py

      - name: Detect Codex credentials
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex merge gate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare artifact directories
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: mkdir -p .artifacts/codex

      - name: Run Codex merge gate
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/merge-on-green.md
          output-file: .artifacts/codex/merge-on-green.json
          codex-args: >-
            ["--profile","ci_mutation","--output-schema",".github/codex/schemas/merge-on-green.json"]
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Publish structured summary
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        run: |
          if [ -f .artifacts/codex/merge-on-green.json ]; then
            {
              echo '```json'
              python -m json.tool .artifacts/codex/merge-on-green.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merge-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-on-green-artifacts
          path: .artifacts
          if-no-files-found: warn
