name: Docs Taxonomy

on:
  push:
    branches:
      - main
    paths:
      - ".agents/**"
      - ".codex/**"
      - "config/**"
      - "plugins/git-slop/skills/**"
      - ".github/codex/**"
      - ".github/workflows/docs-taxonomy.yml"
  schedule:
    - cron: "50 11 * * 3"
  workflow_dispatch:

jobs:
  taxonomy:
    name: Docs taxonomy drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Configure git author
        run: |
          git config user.name "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"

      - name: Configure agent-plugins dependency access
        env:
          AGENT_PLUGINS_GIT_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: |
          if [ -n "$AGENT_PLUGINS_GIT_TOKEN" ]; then
            git config --global url."https://x-access-token:${AGENT_PLUGINS_GIT_TOKEN}@github.com/coreycoto/agent-plugins.git".insteadOf "https://github.com/coreycoto/agent-plugins.git"
          elif GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/coreycoto/agent-plugins.git >/dev/null 2>&1; then
            echo "agent-plugins is publicly readable; no extra git auth configured."
          else
            echo "coreycoto/agent-plugins is private and cannot be fetched from CI without a token." >&2
            echo "Set AGENT_PLUGINS_READ_TOKEN with read access to coreycoto/agent-plugins, or make the repo public." >&2
            exit 1
          fi
      - name: Sync project
        run: uv sync --group dev --group maintainer

      - name: Bootstrap agent-plugins marketplace source
        run: uv run python scripts/bootstrap_agent_plugins_marketplace.py install

      - name: Validate Codex surface
        run: uv run python scripts/validate_codex_surface.py

      - name: Detect Codex credentials
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex taxonomy audit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Codex runtime directories
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          mkdir -p .artifacts/codex .artifacts/docs-taxonomy "$RUNNER_TEMP/codex-home"
          cp .codex/config.toml "$RUNNER_TEMP/codex-home/config.toml"
          cp .codex/*.config.toml "$RUNNER_TEMP/codex-home/"

      - name: Run Codex docs taxonomy audit
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/docs-taxonomy.md
          output-file: .artifacts/codex/docs-taxonomy.json
          codex-home: ${{ runner.temp }}/codex-home
          codex-args: >-
            ["--profile","ci_mutation","--model","gpt-5.4-nano","--output-schema",".github/codex/schemas/docs-taxonomy.json"]
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Publish structured summary
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        run: |
          if [ -f .artifacts/codex/docs-taxonomy.json ]; then
            {
              echo '```json'
              python -m json.tool .artifacts/codex/docs-taxonomy.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload docs-taxonomy artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-taxonomy-artifacts
          path: .artifacts
          if-no-files-found: warn
