name: Docs Taxonomy

on:
  push:
    branches:
      - main
    paths:
      - ".agents/**"
      - ".codex/**"
      - "config/**"
      - "plugins/git-slop/**"
      - ".github/codex/**"
      - ".github/workflows/docs-taxonomy.yml"
  schedule:
    - cron: "50 11 * * 3"
  workflow_dispatch:

jobs:
  taxonomy:
    name: Docs taxonomy drift
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Configure git author
        run: |
          git config user.name "codex[bot]"
          git config user.email "codex[bot]@users.noreply.github.com"

      - name: Validate Codex surface
        run: cargo xtask validate-codex

      - name: Detect Codex credentials
        id: codex_preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; skipping Codex taxonomy audit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare docs-taxonomy artifact roots
        if: steps.codex_preflight.outputs.enabled == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p .artifacts/codex .artifacts/docs-taxonomy
          jq -n \
            --arg event_name "$EVENT_NAME" \
            --arg event_sha "$EVENT_SHA" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            '{
              schema_version: 1,
              event: $event_name,
              event_sha: $event_sha,
              run_id: $run_id,
              run_attempt: $run_attempt
            }' > .artifacts/docs-taxonomy/run-context.json

      - name: Prepare pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        env:
          AGENT_PLUGINS_READ_TOKEN: ${{ secrets.AGENT_PLUGINS_READ_TOKEN }}
        run: scripts/with-agent-plugins.sh --prepare

      - name: Verify pinned agent-plugins runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: scripts/with-agent-plugins.sh --verify

      - name: Prepare pinned Codex runtime
        if: steps.codex_preflight.outputs.enabled == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/codex-runtime/.codex"
          cp .codex/config.toml "$RUNNER_TEMP/codex-runtime/.codex/config.toml"
          cp .codex/*.config.toml "$RUNNER_TEMP/codex-runtime/.codex/"
          scripts/with-agent-plugins.sh marketplace install \
            --manifest .agents/plugins/marketplace-source.json \
            --home "$RUNNER_TEMP/codex-runtime"

      - name: Run Codex docs taxonomy audit
        if: steps.codex_preflight.outputs.enabled == 'true'
        id: run_codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/docs-taxonomy.md
          output-file: .artifacts/codex/docs-taxonomy.json
          codex-home: ${{ runner.temp }}/codex-runtime/.codex
          codex-args: >-
            ["--profile","ci_mutation","--model","gpt-5.6-luna","--output-schema",".github/codex/schemas/docs-taxonomy.json"]
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Publish structured summary
        if: steps.codex_preflight.outputs.enabled == 'true' && always()
        run: |
          if [ -f .artifacts/codex/docs-taxonomy.json ]; then
            {
              echo '```json'
              jq . .artifacts/codex/docs-taxonomy.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload docs-taxonomy artifacts
        if: ${{ always() && steps.codex_preflight.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-taxonomy-artifacts
          path: |
            .artifacts/codex/docs-taxonomy.json
            .artifacts/docs-taxonomy/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
