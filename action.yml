name: Git Slop Repository Health
description: Defragment repository context with deterministic health summaries, regression annotations, and artifacts.
author: Corey Coto

branding:
  icon: shield
  color: purple

inputs:
  version:
    description: Git Slop release version to install, with or without a leading v.
    required: false
    default: "0.11.3"
  release-repository:
    description: GitHub repository that owns the versioned release assets.
    required: false
    default: coreycoto/git-slop
  target:
    description: Optional compatible release target override; primarily used for Linux musl.
    required: false
    default: ""
  github-token:
    description: Token used to download release assets and, when enabled, update a pull request comment.
    required: false
    default: ""
  working-directory:
    description: Directory inside the Git worktree; analysis resolves and runs at that worktree's top level.
    required: false
    default: "."
  scope:
    description: Optional repo-relative monorepo scope; Git evidence remains repository-wide.
    required: false
    default: ""
  report-profile:
    description: Report detail profile. Compact remains comparison-safe through its exhaustive index; full-evidence retains all evidence detail.
    required: false
    default: standard
  compression:
    description: Optional report compression written alongside report.json (none, gzip, or zstd).
    required: false
    default: none
  token-cache:
    description: Persist the content-addressed token cache between trusted workflow runs.
    required: false
    default: "false"
  baseline-report:
    description: Optional base report.json used to emit only new or worsened pull-request findings.
    required: false
    default: ""
  baseline-ref:
    description: Optional Git revision or full SHA to scan in an isolated worktree as the baseline. Mutually exclusive with baseline-report.
    required: false
    default: ""
  allow-shallow:
    description: Explicitly acknowledge incomplete history instead of failing a shallow checkout.
    required: false
    default: "false"
  policy:
    description: Advisory publishes findings without failing; enforce runs git-slop check after publication.
    required: false
    default: advisory
  enforcement:
    description: Absolute applies configured report thresholds; regression fails only for native compare regressions and requires baseline-report or baseline-ref.
    required: false
    default: absolute
  baseline-force:
    description: Record and permit baseline compatibility mismatches. Disabled by default.
    required: false
    default: "false"
  max-baseline-age-days:
    description: Reject a baseline report older than this many days.
    required: false
    default: "30"
  require-baseline-ancestor:
    description: Require the baseline revision to be an ancestor of the head for regression enforcement; baseline-force is the explicit escape hatch.
    required: false
    default: "true"
  fail-on-context-band:
    description: Optional context-band override passed to git-slop check when policy is enforce.
    required: false
    default: ""
  fail-on-slop-band:
    description: Optional slop-band override passed to git-slop check when policy is enforce.
    required: false
    default: ""
  annotations:
    description: Emit bounded GitHub workflow annotations from the generated health report.
    required: false
    default: "true"
  max-annotations:
    description: Maximum number of GitHub workflow annotations to emit, from 0 through 50.
    required: false
    default: "10"
  upload-artifact:
    description: Upload a bounded artifact after analysis.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded workflow artifact.
    required: false
    default: git-slop
  artifact-contents:
    description: "Bounded artifact set: summary, report, or full."
    required: false
    default: summary
  retention-days:
    description: Workflow artifact retention in days, from 1 through 90.
    required: false
    default: "14"
  pr-comment:
    description: Update one marker-based pull request comment. Disabled by default and requires write permission.
    required: false
    default: "false"

outputs:
  status:
    description: Final Action status (advisory, pass, findings, or error).
    value: ${{ steps.finalize.outputs.status }}
  version:
    description: Installed Git Slop version.
    value: ${{ steps.install.outputs.version }}
  target:
    description: Installed Rust target triple.
    value: ${{ steps.install.outputs.target }}
  binary-path:
    description: Absolute path to the verified git-slop executable.
    value: ${{ steps.install.outputs.binary-path }}
  asset-sha256:
    description: Verified SHA-256 digest of the installed release archive.
    value: ${{ steps.install.outputs.sha256 }}
  source-revision:
    description: Full source commit revision verified across the release tag, manifest, and installed binary.
    value: ${{ steps.install.outputs.source-revision }}
  crate-sha256:
    description: Verified SHA-256 of the canonical crates.io package.
    value: ${{ steps.install.outputs.crate-sha256 }}
  release-manifest-sha256:
    description: Verified SHA-256 digest of release-manifest.json.
    value: ${{ steps.install.outputs.release-manifest-sha256 }}
  cache-hit:
    description: Whether the verified binary was reused from RUNNER_TOOL_CACHE.
    value: ${{ steps.install.outputs.cache-hit }}
  analysis-exit-code:
    description: Exit code from the one git-slop find invocation.
    value: ${{ steps.analyze.outputs.analysis-exit-code }}
  policy-exit-code:
    description: Exit code from git-slop check, or zero in advisory mode.
    value: ${{ steps.finalize.outputs.policy-exit-code }}
  finding-count:
    description: Deprecated alias for selected-policy-finding-count.
    value: ${{ steps.analyze.outputs.finding-count }}
  health-finding-count:
    description: Uncapped actionable health findings in the head report.
    value: ${{ steps.analyze.outputs.health-finding-count }}
  policy-finding-count:
    description: Deprecated alias for selected-policy-finding-count.
    value: ${{ steps.analyze.outputs.policy-finding-count }}
  absolute-finding-count:
    description: Findings from the absolute head policy gate after configured thresholds.
    value: ${{ steps.analyze.outputs.absolute-finding-count }}
  selected-policy-finding-count:
    description: Findings selected by enforcement mode (absolute-policy findings or regressions).
    value: ${{ steps.analyze.outputs.selected-policy-finding-count }}
  regression-count:
    description: Native comparator regression count when baseline-report is supplied.
    value: ${{ steps.analyze.outputs.regression-count }}
  baseline-compatible:
    description: Deprecated boolean compatibility alias; prefer baseline-status.
    value: ${{ steps.analyze.outputs.baseline-compatible }}
  baseline-status:
    description: Baseline state (not_evaluated, compatible, forced_incompatible, incompatible, or error).
    value: ${{ steps.analyze.outputs.baseline-status }}
  comparison-path:
    description: Versioned native comparison JSON path when baseline-report is supplied.
    value: ${{ steps.analyze.outputs.comparison-path }}
  comparison-error-path:
    description: Diagnostic path when head analysis succeeds but baseline comparison fails.
    value: ${{ steps.analyze.outputs.comparison-error-path }}
  annotation-count:
    description: Number of requested GitHub annotations, bounded by max-annotations.
    value: ${{ steps.annotate.outputs.annotation-count || '0' }}
  health-path:
    description: Absolute path to health.md.
    value: ${{ steps.analyze.outputs.health-path }}
  report-path:
    description: Absolute path to report.json.
    value: ${{ steps.analyze.outputs.report-path }}
  report-yaml-path:
    description: Absolute path to report.yaml when output.yaml is enabled; otherwise empty.
    value: ${{ steps.analyze.outputs.report-yaml-path }}
  summary-path:
    description: Absolute path to the legacy-compatible summary.md.
    value: ${{ steps.analyze.outputs.summary-path }}
  artifact-id:
    description: GitHub Actions artifact ID when upload-artifact is enabled.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: GitHub Actions artifact URL when upload-artifact is enabled.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: GitHub Actions artifact digest when upload-artifact is enabled.
    value: ${{ steps.upload.outputs.artifact-digest }}
  comment-url:
    description: Pull request comment URL when pr-comment is enabled.
    value: ${{ steps.comment.outputs.comment-url }}

runs:
  using: composite
  steps:
    - name: Install verified Git Slop binary
      id: install
      continue-on-error: true
      shell: bash
      env:
        GIT_SLOP_ACTION_VERSION: ${{ inputs.version }}
        GIT_SLOP_RELEASE_REPOSITORY: ${{ inputs.release-repository }}
        GIT_SLOP_TARGET: ${{ inputs.target }}
        GIT_SLOP_GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: node "${{ github.action_path }}/action/install.mjs"

    - name: Restore optional token cache
      id: token-cache
      if: ${{ inputs.token-cache == 'true' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/git-slop-action/state/cache
        key: git-slop-token-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Analyze repository and publish job summary
      id: analyze
      if: ${{ always() }}
      shell: bash
      env:
        GIT_SLOP_BINARY: ${{ steps.install.outputs.binary-path }}
        GIT_SLOP_INSTALL_OUTCOME: ${{ steps.install.outcome }}
        GIT_SLOP_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GIT_SLOP_SCOPE: ${{ inputs.scope }}
        GIT_SLOP_REPORT_PROFILE: ${{ inputs.report-profile }}
        GIT_SLOP_COMPRESSION: ${{ inputs.compression }}
        GIT_SLOP_TOKEN_CACHE: ${{ inputs.token-cache }}
        GIT_SLOP_BASELINE_REPORT: ${{ inputs.baseline-report }}
        GIT_SLOP_BASELINE_REF: ${{ inputs.baseline-ref }}
        GIT_SLOP_ALLOW_SHALLOW: ${{ inputs.allow-shallow }}
        GIT_SLOP_POLICY: ${{ inputs.policy }}
        GIT_SLOP_ENFORCEMENT: ${{ inputs.enforcement }}
        GIT_SLOP_BASELINE_FORCE: ${{ inputs.baseline-force }}
        GIT_SLOP_MAX_BASELINE_AGE_DAYS: ${{ inputs.max-baseline-age-days }}
        GIT_SLOP_REQUIRE_BASELINE_ANCESTOR: ${{ inputs.require-baseline-ancestor }}
        GIT_SLOP_FAIL_ON_CONTEXT_BAND: ${{ inputs.fail-on-context-band }}
        GIT_SLOP_FAIL_ON_SLOP_BAND: ${{ inputs.fail-on-slop-band }}
        GIT_SLOP_ANNOTATIONS: ${{ inputs.annotations }}
        GIT_SLOP_MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
        GIT_SLOP_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
        GIT_SLOP_ARTIFACT_CONTENTS: ${{ inputs.artifact-contents }}
        GIT_SLOP_RETENTION_DAYS: ${{ inputs.retention-days }}
        GIT_SLOP_PR_COMMENT: ${{ inputs.pr-comment }}
      run: node "${{ github.action_path }}/action/runner.mjs" analyze

    - name: Save optional token cache
      if: ${{ always() && inputs.token-cache == 'true' && steps.analyze.outputs.analysis-exit-code == '0' && steps.token-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/git-slop-action/state/cache
        key: git-slop-token-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Emit bounded repository-health annotations
      id: annotate
      if: ${{ always() && steps.analyze.outputs.analysis-exit-code == '0' && steps.analyze.outputs.annotations-enabled == 'true' }}
      shell: bash
      env:
        GIT_SLOP_BINARY: ${{ steps.install.outputs.binary-path }}
        GIT_SLOP_REPORT_PATH: ${{ steps.analyze.outputs.report-path }}
        GIT_SLOP_FINDING_COUNT: ${{ steps.analyze.outputs.finding-count }}
        GIT_SLOP_MAX_ANNOTATIONS: ${{ steps.analyze.outputs.max-annotations }}
        GIT_SLOP_WORKING_DIRECTORY_RESOLVED: ${{ steps.analyze.outputs.working-directory }}
        GIT_SLOP_COMPARISON_PATH: ${{ steps.analyze.outputs.comparison-path }}
        GIT_SLOP_COMPARISON_ERROR_PATH: ${{ steps.analyze.outputs.comparison-error-path }}
      run: node "${{ github.action_path }}/action/runner.mjs" annotate

    - name: Select bounded artifact files
      id: artifact-files
      if: ${{ always() && steps.analyze.outputs.upload-enabled == 'true' }}
      shell: bash
      env:
        GIT_SLOP_ARTIFACT_CONTENTS: ${{ steps.analyze.outputs.artifact-contents }}
        GIT_SLOP_HEALTH_PATH: ${{ steps.analyze.outputs.health-path }}
        GIT_SLOP_REPORT_PATH: ${{ steps.analyze.outputs.report-path }}
        GIT_SLOP_REPORT_YAML_PATH: ${{ steps.analyze.outputs.report-yaml-path }}
        GIT_SLOP_SUMMARY_PATH: ${{ steps.analyze.outputs.summary-path }}
        GIT_SLOP_COMPARISON_PATH: ${{ steps.analyze.outputs.comparison-path }}
        GIT_SLOP_COMPARISON_ERROR_PATH: ${{ steps.analyze.outputs.comparison-error-path }}
      run: node "${{ github.action_path }}/action/runner.mjs" artifacts

    - name: Upload bounded Git Slop artifact
      id: upload
      if: ${{ always() && steps.analyze.outputs.upload-enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.artifact-files.outputs.paths }}
        if-no-files-found: error
        retention-days: ${{ steps.analyze.outputs.retention-days }}
        compression-level: 6
        overwrite: false
        # Paths come from runner.mjs's exact allowlist. This must be true because
        # every report lives below the intentionally hidden .slop directory.
        include-hidden-files: true

    - name: Update pull request health comment
      id: comment
      if: ${{ always() && steps.analyze.outputs.analysis-exit-code == '0' && steps.analyze.outputs.comment-enabled == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      env:
        GIT_SLOP_HEALTH_PATH: ${{ steps.analyze.outputs.health-path }}
        GIT_SLOP_COMPARISON_PATH: ${{ steps.analyze.outputs.comparison-path }}
        GIT_SLOP_COMPARISON_ERROR_PATH: ${{ steps.analyze.outputs.comparison-error-path }}
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- git-slop-repository-health -->";
          const report = fs.readFileSync(process.env.GIT_SLOP_HEALTH_PATH, "utf8");
          let baseline = "\n\n## Regression baseline\n\nNo baseline comparison was requested.";
          if (process.env.GIT_SLOP_COMPARISON_PATH && fs.existsSync(process.env.GIT_SLOP_COMPARISON_PATH)) {
            const comparison = JSON.parse(fs.readFileSync(process.env.GIT_SLOP_COMPARISON_PATH, "utf8"));
            baseline = `\n\n## Regression baseline\n\n- regressions: **${comparison.summary?.regression_count ?? 0}**\n- status: **${comparison.baseline_status ?? "unknown"}**\n\nThe repository-health section above is the absolute head state; this section reports only baseline movement.`;
          } else if (process.env.GIT_SLOP_COMPARISON_ERROR_PATH && fs.existsSync(process.env.GIT_SLOP_COMPARISON_ERROR_PATH)) {
            baseline = "\n\n## Regression baseline\n\n> [!WARNING]\n> Baseline comparison failed. The absolute head health above remains valid; inspect the workflow artifact for the comparison diagnostic.";
          }
          const maximumBodyLength = 60_000;
          const suffix = "\n\n_Report truncated in the pull request comment; use the job summary or artifact for the complete analysis._";
          const prefix = `${marker}\n`;
          const utf8Prefix = (value, maximumBytes) => {
            const bytes = Buffer.from(value, "utf8");
            if (bytes.length <= maximumBytes) return value;
            let end = maximumBytes;
            while (end > 0 && (bytes[end] & 0xC0) === 0x80) end -= 1;
            return bytes.subarray(0, end).toString("utf8");
          };
          const completeBody = `${prefix}${report}${baseline}`;
          const available = maximumBodyLength - Buffer.byteLength(prefix) - Buffer.byteLength(suffix);
          const body = Buffer.byteLength(completeBody) > maximumBodyLength
            ? `${prefix}${utf8Prefix(`${report}${baseline}`, available)}${suffix}`
            : completeBody;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((comment) =>
            comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
          );
          const response = existing
            ? await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            : await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
          core.setOutput("comment-url", response.data.html_url);

    - name: Apply optional policy gate
      id: finalize
      if: ${{ always() }}
      shell: bash
      env:
        GIT_SLOP_BINARY: ${{ steps.install.outputs.binary-path }}
        GIT_SLOP_ANALYSIS_EXIT_CODE: ${{ steps.analyze.outputs.analysis-exit-code }}
        GIT_SLOP_POLICY: ${{ steps.analyze.outputs.policy }}
        GIT_SLOP_ENFORCEMENT: ${{ steps.analyze.outputs.enforcement }}
        GIT_SLOP_REGRESSION_COUNT: ${{ steps.analyze.outputs.regression-count }}
        GIT_SLOP_BASELINE_STATUS: ${{ steps.analyze.outputs.baseline-status }}
        GIT_SLOP_FAIL_ON_CONTEXT_BAND: ${{ steps.analyze.outputs.fail-on-context-band }}
        GIT_SLOP_FAIL_ON_SLOP_BAND: ${{ steps.analyze.outputs.fail-on-slop-band }}
        GIT_SLOP_REPORT_PATH: ${{ steps.analyze.outputs.report-path }}
        GIT_SLOP_WORKING_DIRECTORY_RESOLVED: ${{ steps.analyze.outputs.working-directory }}
        GIT_SLOP_ANNOTATE_OUTCOME: ${{ steps.annotate.outcome }}
        GIT_SLOP_ARTIFACT_SELECTION_OUTCOME: ${{ steps.artifact-files.outcome }}
        GIT_SLOP_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        GIT_SLOP_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        GIT_SLOP_COMMENT_OUTCOME: ${{ steps.comment.outcome }}
      run: node "${{ github.action_path }}/action/runner.mjs" finalize
