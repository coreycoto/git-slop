[package]
name = "git-slop-xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Private maintainer automation for git-slop"

[workspace]
resolver = "3"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3.23"
