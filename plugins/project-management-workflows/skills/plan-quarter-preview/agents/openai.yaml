interface:
  display_name: "Quarter Plan Preview"
  short_description: "Preview which issues should be committed to a quarter"
  default_prompt: "Use $plan-quarter-preview to preview which issues should be explicitly committed to a target quarter."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "connector"
      value: "github"
      description: "GitHub connector and official GitHub Codex plugin"
