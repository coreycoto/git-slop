interface:
  display_name: "Plan Backlog Preview"
  short_description: "Preview backlog-ready maintenance issues from plan output"
  default_prompt: "Use $plan-to-backlog-preview to preview how reviewed plan slices would map into backlog-ready maintenance issues."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "connector"
      value: "github"
      description: "GitHub connector and official GitHub Codex plugin"
