interface:
  display_name: "Merge On Green"
  short_description: "Merge an eligible automation PR only after all gates pass"
  default_prompt: "Use $merge-on-green to verify an automation PR is merge-safe before running the final merge."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "connector"
      value: "github"
      description: "GitHub connector and official GitHub Codex plugin"
