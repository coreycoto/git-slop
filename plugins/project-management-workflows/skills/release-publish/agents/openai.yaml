interface:
  display_name: "Release Publish"
  short_description: "Publish a semver-tagged GitHub release with standard flows"
  default_prompt: "Use $release-publish to prepare notes, build artifacts, and publish the tagged GitHub release."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "connector"
      value: "github"
      description: "Official GitHub Codex plugin"
