interface:
  display_name: "GitHub Backlog Mutate"
  short_description: "Apply a reviewed mixed backlog mutation plan in GitHub"
  default_prompt: "Use $github-backlog-mutate to validate and apply a reviewed issue-centric backlog mutation plan."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "connector"
      value: "github"
      description: "GitHub connector and official GitHub Codex plugin"
