interface:
  display_name: "Intake"
  short_description: "Turn local research into reviewed backlog changes"
  default_prompt: "Use $intake to ingest local notes, markdown, or DOCX research into the current backlog with the minimum evidence-backed GitHub updates."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "connector"
      value: "github"
      description: "GitHub connector and official GitHub Codex plugin"
