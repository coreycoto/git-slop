[package]
name = "git-slop"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic repository health and maintenance-pressure analysis for humans and AI agents."
license = "MIT"
readme = "README.md"
repository = "https://github.com/coreycoto/git-slop"
homepage = "https://github.com/coreycoto/git-slop"
keywords = ["git", "static-analysis", "repository", "developer-tools", "ci"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/*.rs",
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE",
    "/docs/*.md",
    "/man/git-slop.1",
    "/tests/*.rs",
    "/tests/fixtures/reports/*",
]

[[bin]]
name = "git-slop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
hex = "0.4"
percent-encoding = "2.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tiktoken-rs = "0.12"
unicode-normalization = "0.1"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["."]
default-members = ["."]
exclude = ["xtask"]
resolver = "3"
