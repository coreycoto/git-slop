[package]
name = "git-slop"
version = "0.14.0"
edition = "2024"
rust-version = "1.85"
description = "A deterministic repository token-defragmenter for humans and AI agents."
license = "MIT"
readme = "README.md"
repository = "https://github.com/coreycoto/git-slop"
homepage = "https://github.com/coreycoto/git-slop"
publish = ["crates-io"]
keywords = ["git", "static-analysis", "repository", "developer-tools", "ci"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/*.rs",
    "/src/**/*.rs",
    "/src/cli/html/*.css",
    "/src/cli/html/*.js",
    "/README.md",
    "/LICENSE",
    "/assets/brand/*",
    "/docs/*.md",
    "/man/git-slop.1",
    "/schemas/*.json",
    "/schemas/README.md",
    "/tests/*.rs",
    "/tests/fixtures/reports/*",
]
build = "build.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[[bin]]
name = "git-slop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_complete_nushell = "4.5"
clap_mangen = "0.3"
globset = "0.4"
fs2 = "0.4"
flate2 = "1.1"
hex = "0.4"
jsonschema = { version = "0.49.2", default-features = false }
libc = "0.2"
percent-encoding = "2.3"
regex = "1.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
tiktoken-rs = "0.11"
thiserror = "2.0"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.23"

[build-dependencies]
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["."]
default-members = ["."]
exclude = ["xtask"]
resolver = "3"
